name: Build Linux Show Machine App

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths:
      - 'show-machine-app/**'
  pull_request:
    paths:
      - 'show-machine-app/**'
  workflow_dispatch:

jobs:
  build:
    name: Build Linux App
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: show-machine-app/package-lock.json
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxtst-dev libpng-dev build-essential
      
      - name: Install dependencies
        working-directory: show-machine-app
        run: npm ci
      
      - name: Build Linux app
        working-directory: show-machine-app
        run: npm run build:linux
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: open-clicker-show-machine-linux
          path: show-machine-app/dist/*.AppImage
          if-no-files-found: error
      
      - name: Create Release Assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: show-machine-app/dist/*.AppImage
          draft: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
