<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Open Clicker Show Machine</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
      background: #f2f3f7;
      color: #222;
      padding: 16px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      gap: 12px;
      font-size: 13px;
    }

    .panel {
      background: white;
      border: 1px solid #e2e4ec;
      border-radius: 10px;
      padding: 14px 16px;
    }

    .row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }
    .row:last-child { margin-bottom: 0; }

    label.inline {
      flex: 0 0 90px;
      color: #555;
      font-weight: 600;
      text-align: right;
    }

    input[type="text"], select {
      flex: 1;
      min-width: 0;
      padding: 8px 10px;
      border: 1px solid #d6d9e3;
      border-radius: 7px;
      font-size: 13px;
      background: #fbfbfd;
      color: #222;
    }
    input[type="text"]:focus, select:focus {
      outline: none;
      border-color: #667eea;
      background: white;
    }

    button {
      background: #667eea;
      color: white;
      border: none;
      border-radius: 7px;
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      flex: 0 0 auto;
    }
    button:hover:not(:disabled) { background: #5568d3; }
    button:disabled { background: #c3c6d4; cursor: default; }
    button.secondary { background: #6c757d; }
    button.secondary:hover:not(:disabled) { background: #5a6268; }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 999px;
      background: #eceef5;
      color: #555;
    }
    .status-pill.live { background: #e4f6ea; color: #1c7a41; }
    .status-pill.warn { background: #fdf3e2; color: #96631a; }
    .status-pill.err { background: #fdeaea; color: #a52222; }

    .arrows {
      display: flex;
      justify-content: center;
      gap: 14px;
    }
    .arrows button {
      width: 92px;
      height: 52px;
      font-size: 24px;
      background: #4a4f63;
    }
    .arrows button:hover:not(:disabled) { background: #383c4d; }

    #log {
      flex: 1;
      min-height: 120px;
      overflow-y: auto;
      background: #1c1f2b;
      border-radius: 10px;
      padding: 10px 12px;
      font-family: 'SF Mono', Menlo, Consolas, monospace;
      font-size: 12px;
      color: #d8dbe6;
    }
    .log-line { display: flex; gap: 8px; padding: 2px 0; }
    .log-line .t { opacity: 0.45; flex: 0 0 auto; }
    .log-line.success { color: #7ee2a8; }
    .log-line.error { color: #ff9a9a; }
    .log-line.warning { color: #ffd08a; }
    .log-line.next, .log-line.prev { color: #9db8ff; }

    .checkbox {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 500;
      color: #333;
      cursor: pointer;
    }
    .checkbox input { width: 15px; height: 15px; cursor: pointer; }
    .checkbox.disabled { color: #9a9db0; cursor: default; }

    .cast-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-top: 10px;
    }
    .cast-grid h3 {
      font-size: 12px;
      color: #555;
      margin-bottom: 6px;
      font-weight: 600;
    }
    #screen-list {
      border: 1px solid #e2e4ec;
      border-radius: 8px;
      max-height: 128px;
      overflow-y: auto;
      background: #fbfbfd;
    }
    .screen-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      cursor: pointer;
      border-bottom: 1px solid #eef0f6;
    }
    .screen-item:last-child { border-bottom: none; }
    .screen-item.selected { background: #e8ebfb; }
    .screen-item img { width: 56px; border-radius: 3px; display: block; }
    .screen-item span { font-size: 12px; }
    .empty { padding: 10px; color: #9a9db0; font-size: 12px; }

    input[type="range"] { width: 100%; }
    .quality-readout {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: #555;
      margin-top: 4px;
    }
    .quality-readout strong { display: block; color: #222; }

    .hint { color: #8a8d9e; font-size: 11px; margin-top: 6px; }
  </style>
</head>
<body>
  <div class="panel">
    <div class="row">
      <label class="inline" for="session-code">Cue link / code</label>
      <input type="text" id="session-code" placeholder="Paste cue link or enter code" autocomplete="off">
      <button id="connect-btn">(Re)Connect</button>
    </div>
    <div class="row">
      <label class="inline" for="server-url">Server</label>
      <input type="text" id="server-url" placeholder="http://localhost:3000" autocomplete="off">
      <button id="disconnect-btn" class="secondary" disabled>Disconnect</button>
    </div>
    <div class="row">
      <label class="inline">Status</label>
      <span class="status-pill" id="status-pill">Not connected</span>
    </div>
  </div>

  <div class="panel arrows">
    <button id="prev-btn" disabled>&lt;</button>
    <button id="next-btn" disabled>&gt;</button>
  </div>

  <div id="log"></div>

  <div class="panel">
    <div class="row">
      <label class="inline" for="target-app">Control</label>
      <select id="target-app">
        <option value="focused">Any app (focused window)</option>
        <option value="powerpoint">Microsoft PowerPoint</option>
        <option value="keynote" id="keynote-option">Keynote (macOS)</option>
      </select>
    </div>

    <label class="checkbox" id="cast-label">
      <input type="checkbox" id="cast-toggle">
      <span>Send screenshots of the selected screen</span>
    </label>
    <div class="hint" id="cast-hint">The producer must enable the screenshot feature for this session.</div>

    <label class="checkbox" id="notes-label" style="margin-top: 10px;">
      <input type="checkbox" id="notes-toggle">
      <span>Send PowerPoint speaker notes to the presenter</span>
    </label>
    <div class="hint" id="notes-hint">The producer must enable speaker notes for this session.</div>

    <div class="cast-grid">
      <div>
        <h3>Screenshot quality</h3>
        <input type="range" id="quality-slider" min="0" max="4" step="1" value="1">
        <div class="quality-readout">
          <div>Resolution<strong id="quality-res">400p</strong></div>
          <div>Bandwidth<strong id="quality-bw">–</strong></div>
        </div>
      </div>
      <div>
        <h3>Pick a screen to cast</h3>
        <div id="screen-list"><div class="empty">No screens listed yet</div></div>
      </div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
