<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Open Clicker Show Machine</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 20px;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .container {
      background: white;
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    h1 {
      color: #333;
      margin-bottom: 10px;
      font-size: 24px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 30px;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #555;
      font-weight: 500;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 2px solid #e0e0e0;
      border-radius: 6px;
      font-size: 14px;
      transition: border-color 0.3s;
    }

    input:focus {
      outline: none;
      border-color: #667eea;
    }

    input::placeholder {
      color: #aaa;
    }

    button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    button:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }

    button:active:not(:disabled) {
      transform: translateY(0);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    button.disconnect {
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      margin-top: 10px;
    }

    button.disconnect:hover:not(:disabled) {
      box-shadow: 0 4px 12px rgba(245, 87, 108, 0.4);
    }

    .status {
      margin-top: 20px;
      padding: 15px;
      border-radius: 6px;
      font-size: 14px;
      display: none;
    }

    .status.show {
      display: block;
    }

    .status.info {
      background: #e3f2fd;
      color: #1976d2;
      border-left: 4px solid #1976d2;
    }

    .status.success {
      background: #e8f5e9;
      color: #388e3c;
      border-left: 4px solid #388e3c;
    }

    .status.error {
      background: #ffebee;
      color: #c62828;
      border-left: 4px solid #c62828;
    }

    .status.warning {
      background: #fff3e0;
      color: #f57c00;
      border-left: 4px solid #f57c00;
    }

    .activity-log {
      margin-top: 20px;
      flex: 1;
      overflow-y: auto;
      border-top: 2px solid #e0e0e0;
      padding-top: 15px;
    }

    .activity-log h3 {
      font-size: 14px;
      color: #666;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .activity-item {
      padding: 8px 12px;
      background: #f5f5f5;
      border-radius: 4px;
      margin-bottom: 6px;
      font-size: 13px;
      color: #555;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .activity-item .icon {
      font-size: 16px;
    }

    .activity-item.next {
      background: #e3f2fd;
      color: #1976d2;
    }

    .activity-item.prev {
      background: #fff3e0;
      color: #f57c00;
    }

    #connect-form.hidden {
      display: none;
    }

    #connected-view {
      display: none;
    }

    #connected-view.show {
      display: block;
    }

    .info-box {
      background: #f5f5f5;
      border-radius: 6px;
      padding: 15px;
      margin-bottom: 20px;
      font-size: 13px;
      color: #666;
    }

    .info-box strong {
      color: #333;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎮 Open Clicker Show Machine</h1>
    <p class="subtitle">Connect to your session and control your presentation</p>

    <div id="connect-form">
      <form id="connection-form">
        <div class="form-group">
          <label for="server-url">Server URL</label>
          <input 
            type="text" 
            id="server-url" 
            placeholder="http://localhost:3000" 
            value="http://localhost:3000"
            required
          >
        </div>

        <div class="form-group">
          <label for="session-code">Session Code</label>
          <input 
            type="text" 
            id="session-code" 
            placeholder="ABC123" 
            required
            maxlength="6"
            style="text-transform: uppercase;"
          >
        </div>

        <button type="submit" id="connect-btn">Connect</button>
      </form>
    </div>

    <div id="connected-view">
      <div class="info-box">
        <strong>Server:</strong> <span id="connected-server"></span><br>
        <strong>Session:</strong> <span id="connected-code"></span>
      </div>
      <button class="disconnect" id="disconnect-btn">Disconnect</button>
      <div class="activity-log">
        <h3>Activity</h3>
        <div id="activity-list"></div>
      </div>
    </div>

    <div id="status-message" class="status"></div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
