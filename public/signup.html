<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#667eea">
  <title>Sign Up - Open Clicker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 16px;
      padding: 40px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    .logo {
      text-align: center;
      margin-bottom: 10px;
    }
    .logo-text {
      font-size: 28px;
      font-weight: 700;
      color: #667eea;
    }
    h1 {
      color: #333;
      margin-bottom: 8px;
      font-size: 24px;
      text-align: center;
    }
    .subtitle {
      color: #666;
      margin-bottom: 32px;
      font-size: 14px;
      text-align: center;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      color: #333;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 8px;
    }
    input[type="email"], input[type="password"] {
      width: 100%;
      padding: 12px 14px;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
      transition: border-color 0.2s;
    }
    input[type="email"]:focus, input[type="password"]:focus {
      outline: none;
      border-color: #667eea;
    }
    .password-hint {
      font-size: 12px;
      color: #999;
      margin-top: 4px;
    }
    .button {
      width: 100%;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 14px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 8px;
    }
    .button:hover {
      background: #5568d3;
    }
    .button:active {
      transform: scale(0.98);
    }
    .button:disabled {
      background: #ccc;
      cursor: not-allowed;
      transform: none;
    }
    .divider {
      text-align: center;
      margin: 24px 0;
      color: #999;
      font-size: 14px;
      position: relative;
    }
    .divider::before,
    .divider::after {
      content: '';
      position: absolute;
      top: 50%;
      width: 40%;
      height: 1px;
      background: #ddd;
    }
    .divider::before {
      left: 0;
    }
    .divider::after {
      right: 0;
    }
    .signin-link {
      text-align: center;
      margin-top: 24px;
      color: #666;
      font-size: 14px;
    }
    .signin-link a {
      color: #667eea;
      text-decoration: none;
      font-weight: 600;
    }
    .signin-link a:hover {
      text-decoration: underline;
    }
    .error {
      color: #dc3545;
      font-size: 14px;
      margin-top: 12px;
      text-align: center;
    }
    .success {
      color: #28a745;
      font-size: 14px;
      margin-top: 12px;
      text-align: center;
    }
    .back-home {
      text-align: center;
      margin-top: 20px;
    }
    .back-home a {
      color: #667eea;
      font-size: 14px;
      text-decoration: none;
    }
    .back-home a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <div class="logo-text">🎯 Open Clicker</div>
    </div>
    <h1>Create your account</h1>
    <p class="subtitle">Start managing presentations in minutes</p>
    
    <form id="signupForm" onsubmit="handleSignUp(event)">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autocomplete="email" placeholder="you@example.com">
      </div>
      
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required autocomplete="new-password" placeholder="Create a password" minlength="6">
        <div class="password-hint">Minimum 6 characters</div>
      </div>
      
      <button type="submit" class="button">Create Account</button>
      
      <div class="error" id="error"></div>
    </form>
    
    <div class="divider">OR</div>
    
    <div class="signin-link">
      Already have an account? <a href="/signin.html">Sign in</a>
    </div>
    
    <div class="back-home">
      <a href="/">← Back to home</a>
    </div>
  </div>

  <script>
    async function handleSignUp(event) {
      event.preventDefault();
      
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const errorEl = document.getElementById('error');
      
      errorEl.textContent = '';
      
      if (!email || !password) {
        errorEl.textContent = 'Please enter email and password';
        return;
      }
      
      if (password.length < 6) {
        errorEl.textContent = 'Password must be at least 6 characters';
        return;
      }
      
      try {
        const response = await fetch('/api/signup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        
        const data = await response.json();
        
        if (response.ok) {
          window.location.href = '/control-center.html';
        } else {
          errorEl.textContent = data.error || 'Sign up failed';
        }
      } catch (error) {
        console.error('Sign up error:', error);
        errorEl.textContent = 'Network error. Please try again.';
      }
    }
  </script>
</body>
</html>
