<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1a1a1a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Clicker - Open Clicker</title>
  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    html {
      height: 100%;
      overflow: hidden;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a1a;
      color: white;
      height: 100%;
      overflow: hidden;
      touch-action: manipulation;
      position: fixed;
      width: 100%;
    }
    #join-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding: max(20px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
    }
    h1 {
      margin-bottom: 24px;
      font-size: clamp(24px, 6vw, 32px);
    }
    .join-form {
      background: #2a2a2a;
      padding: 24px;
      border-radius: 16px;
      width: 100%;
      max-width: 400px;
    }
    input[type="text"] {
      width: 100%;
      padding: 16px;
      font-size: 20px;
      border: 2px solid #444;
      border-radius: 12px;
      background: #1a1a1a;
      color: white;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 16px;
    }
    input[type="text"]:focus {
      outline: none;
      border-color: #667eea;
    }
    .button {
      width: 100%;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 12px;
      padding: 16px;
      font-size: 18px;
      cursor: pointer;
      transition: all 0.2s;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      min-height: 48px;
    }
    .button:active {
      transform: scale(0.98);
    }
    #clicker-screen {
      display: none;
      height: 100vh;
      height: 100dvh;
      flex-direction: column;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }
    .header {
      padding: 16px max(16px, env(safe-area-inset-left)) 16px max(16px, env(safe-area-inset-right));
      text-align: center;
      background: #2a2a2a;
      flex-shrink: 0;
    }
    .session-info {
      font-size: 12px;
      color: #999;
    }
    .session-code {
      font-size: clamp(20px, 5vw, 24px);
      font-weight: bold;
      color: #667eea;
      font-family: 'Courier New', monospace;
      margin: 6px 0;
    }
    .status {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      margin-top: 4px;
    }
    .status.locked {
      background: #dc3545;
    }
    .status.unlocked {
      background: #28a745;
    }
    .time-display {
      margin: 10px 0 6px;
    }
    .clock {
      font-size: clamp(20px, 5vw, 24px);
      font-weight: 600;
      font-family: 'Courier New', monospace;
      color: #999;
      margin-bottom: 4px;
    }
    .timer {
      font-size: clamp(32px, 8vw, 42px);
      font-weight: bold;
      font-family: 'Courier New', monospace;
      color: #667eea;
    }
    .timer.idle {
      font-size: clamp(18px, 4.5vw, 22px);
      color: #555;
    }
    .timer.warning { color: #ffc107; }
    .timer.danger { color: #dc3545; }
    .controls {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
      min-height: 0;
      overflow: hidden;
    }
    .control-button {
      background: #2a2a2a;
      border: 2px solid #1a1a1a;
      color: white;
      font-size: clamp(32px, 8vw, 48px);
      font-weight: bold;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-user-select: none;
      min-height: 120px;
      touch-action: manipulation;
    }
    .control-button.prev-button {
      background: #dc3545;
      border-color: #a02834;
    }
    .control-button.prev-button:active {
      background: #c82333;
      transform: scale(0.98);
    }
    .control-button.next-button {
      background: #28a745;
      border-color: #1e7e34;
    }
    .control-button.next-button:active {
      background: #218838;
      transform: scale(0.98);
    }
    .control-button:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }
    .control-button:disabled:active {
      background: inherit;
      transform: none;
    }
    .notes {
      padding: 14px max(16px, env(safe-area-inset-left)) 14px max(16px, env(safe-area-inset-right));
      background: #2a2a2a;
      max-height: 160px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      border-top: 2px solid #1a1a1a;
      flex-shrink: 0;
    }
    .notes-title {
      font-size: 11px;
      color: #999;
      text-transform: uppercase;
      margin-bottom: 6px;
      font-weight: 600;
    }
    .notes-content {
      font-size: 14px;
      line-height: 1.5;
      color: #ccc;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .error {
      color: #dc3545;
      margin-top: 12px;
      text-align: center;
      font-size: 14px;
    }
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal.active {
      display: flex;
    }
    .modal-content {
      background: #2a2a2a;
      border-radius: 16px;
      padding: 24px;
      max-width: 400px;
      width: 100%;
      text-align: center;
    }
    .modal-content h2 {
      margin-bottom: 16px;
      font-size: 22px;
    }
    .modal-content input[type="text"] {
      width: 100%;
      padding: 14px;
      font-size: 18px;
      border: 2px solid #444;
      border-radius: 12px;
      background: #1a1a1a;
      color: white;
      text-align: center;
      margin-bottom: 16px;
      text-transform: none;
      letter-spacing: normal;
    }
    .modal-content input[type="text"]:focus {
      outline: none;
      border-color: #667eea;
    }
    .modal-content .button {
      width: 100%;
      margin-bottom: 8px;
    }
    .modal-content .button.secondary {
      background: #6c757d;
    }
    .modal-content .button.secondary:active {
      background: #5a6268;
    }
    .screenshot-panel {
      background: #2a2a2a;
      border-top: 2px solid #1a1a1a;
      padding: 14px max(16px, env(safe-area-inset-left)) 14px max(16px, env(safe-area-inset-right));
      max-height: 200px;
      overflow: hidden;
      flex-shrink: 0;
      display: none;
    }
    .screenshot-title {
      font-size: 11px;
      color: #999;
      text-transform: uppercase;
      margin-bottom: 6px;
      font-weight: 600;
    }
    .screenshot-container {
      width: 100%;
      height: auto;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .screenshot-container img {
      max-width: 100%;
      max-height: 150px;
      border-radius: 8px;
      border: 1px solid #444;
    }
    .feature-buttons {
      padding: 12px max(16px, env(safe-area-inset-left)) 12px max(16px, env(safe-area-inset-right));
      background: #2a2a2a;
      border-top: 2px solid #1a1a1a;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      flex-shrink: 0;
    }
    .feature-button {
      flex: 1;
      min-width: 100px;
      padding: 10px 16px;
      font-size: 14px;
      border-radius: 8px;
      border: 2px solid #444;
      background: #1a1a1a;
      color: white;
      cursor: pointer;
      transition: all 0.2s;
      font-weight: 500;
    }
    .feature-button:active {
      transform: scale(0.98);
    }
    .feature-button.active {
      background: #667eea;
      border-color: #667eea;
    }
    .message-modal .modal-content {
      max-height: 80vh;
      overflow-y: auto;
    }
    .message-text {
      background: #1a1a1a;
      padding: 16px;
      border-radius: 8px;
      margin: 16px 0;
      font-size: 16px;
      line-height: 1.5;
    }
    .voice-status {
      font-size: 12px;
      color: #999;
      margin-top: 4px;
    }
    .voice-status.listening {
      color: #28a745;
    }
    @media (max-width: 400px) {
      .join-form {
        padding: 20px;
      }
      .header {
        padding: 12px max(12px, env(safe-area-inset-left)) 12px max(12px, env(safe-area-inset-right));
      }
    }
  </style>
</head>
<body>
  <div id="join-screen">
    <h1>🎯 Clicker</h1>
    <div class="join-form">
      <input type="text" id="codeInput" placeholder="Session Code" autocomplete="off">
      <div id="nameFieldContainer" style="display: none;">
        <input type="text" id="displayNameInput" placeholder="Your Name" autocomplete="off" style="text-transform: none; letter-spacing: normal;">
      </div>
      <button class="button" onclick="checkSessionAndJoin()">Join Session</button>
      <div class="error" id="error"></div>
    </div>
  </div>

  <div id="clicker-screen">
    <div class="header">
      <div class="session-info">Session</div>
      <div class="session-code" id="sessionCode"></div>
      <div>
        <span class="status unlocked" id="lockStatus">Ready</span>
      </div>
      <div class="time-display">
        <div class="clock" id="clock">--:--:--</div>
        <div class="timer idle" id="timer">No timer set</div>
      </div>
    </div>
    
    <div class="feature-buttons" id="featureButtons" style="display: none;">
      <button class="feature-button" id="screenshotBtn" onclick="toggleScreenshot()">📸 Screenshot</button>
      <button class="feature-button" id="laserBtn" onclick="toggleLaser()">🔴 Laser</button>
      <button class="feature-button" id="voiceBtn" onclick="toggleVoice()">🎤 Voice</button>
    </div>
    
    <div class="screenshot-panel" id="screenshotPanel">
      <div class="screenshot-title">Live Slide Preview</div>
      <div class="screenshot-container">
        <img id="screenshotImg" src="" alt="Slide preview">
      </div>
    </div>
    
    <div class="controls">
      <button class="control-button prev-button" id="prevBtn" onclick="sendCommand('prev')">
        ← PREV
      </button>
      <button class="control-button next-button" id="nextBtn" onclick="sendCommand('next')">
        NEXT →
      </button>
    </div>

    <div class="notes" id="notesSection" style="display: none;">
      <div class="notes-title">Speaker Notes</div>
      <div class="notes-content" id="notesContent"></div>
    </div>
  </div>

  <div class="modal" id="nameModal">
    <div class="modal-content">
      <h2>Enter Your Name</h2>
      <p style="color: #ccc; margin-bottom: 16px; font-size: 14px;">The presenter would like you to provide your name</p>
      <input type="text" id="modalNameInput" placeholder="Your Name" autocomplete="off">
      <button class="button" onclick="submitNameFromModal()">Submit</button>
      <button class="button secondary" onclick="closeNameModal()">Maybe Later</button>
    </div>
  </div>

  <div class="modal message-modal" id="messageModal">
    <div class="modal-content">
      <h2>💬 Speaker Chat</h2>
      <div class="message-text" id="messageText"></div>
      <button class="button" onclick="closeMessageModal()">OK</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let sessionCode = null;
    let clickerToken = null;
    let clickAccessEnabled = true;
    let wakeLock = null;
    let timerInterval = null;
    let timerEndTime = null;
    let clockInterval = null;
    let requireName = false;
    let features = {};
    let screenshotVisible = false;
    let laserActive = false;
    let voiceActive = false;
    let recognition = null;

    async function requestWakeLock() {
      if ('wakeLock' in navigator) {
        try {
          wakeLock = await navigator.wakeLock.request('screen');
          console.log('Wake lock activated');
          
          wakeLock.addEventListener('release', () => {
            console.log('Wake lock released');
          });
        } catch (err) {
          console.error('Wake lock error:', err);
        }
      }
    }

    document.addEventListener('visibilitychange', async () => {
      if (wakeLock !== null && document.visibilityState === 'visible') {
        await requestWakeLock();
      }
    });

    socket.on('session-joined', (data) => {
      sessionCode = data.code;
      clickerToken = data.token;
      clickAccessEnabled = data.clickAccessEnabled !== undefined ? data.clickAccessEnabled : true;
      features = data.features || {};
      
      document.getElementById('sessionCode').textContent = data.code;
      document.getElementById('join-screen').style.display = 'none';
      document.getElementById('clicker-screen').style.display = 'flex';
      
      if (data.locked !== undefined) {
        updateLockStatus(data.locked);
      }
      
      updateClickAccessStatus();
      updateFeatureButtons();
      
      if (data.notes) {
        updateNotes(data.notes);
      }

      if (data.timer && data.timerStartedAt) {
        timerEndTime = data.timerStartedAt + (data.timer * 1000);
        updateTimerDisplay();
        timerInterval = setInterval(updateTimerDisplay, 100);
      } else {
        updateTimerDisplay();
      }
      
      if (data.screenshot) {
        updateScreenshot(data.screenshot);
      }
      
      updateClock();
      clockInterval = setInterval(updateClock, 1000);
      
      requestWakeLock();
    });

    socket.on('name-prompt', () => {
      document.getElementById('nameModal').classList.add('active');
    });

    socket.on('display-name-updated', ({ displayName }) => {
      console.log('Display name updated to:', displayName);
      closeNameModal();
    });

    socket.on('lock-changed', ({ locked }) => {
      updateLockStatus(locked);
    });

    socket.on('click-access-changed', ({ clickAccessEnabled: enabled }) => {
      clickAccessEnabled = enabled;
      updateClickAccessStatus();
    });

    socket.on('notes-changed', ({ notes }) => {
      updateNotes(notes);
    });

    socket.on('timer-changed', ({ timer, timerStartedAt }) => {
      timerEndTime = timerStartedAt + (timer * 1000);
      updateTimerDisplay();
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(updateTimerDisplay, 100);
    });

    socket.on('features-changed', ({ features: newFeatures }) => {
      features = { ...features, ...newFeatures };
      updateFeatureButtons();
    });

    socket.on('screenshot-updated', ({ screenshot }) => {
      updateScreenshot(screenshot);
    });

    socket.on('message-received', ({ message, timestamp, from }) => {
      showMessage(message);
    });

    socket.on('error', ({ message }) => {
      document.getElementById('error').textContent = message;
    });

    socket.on('session-ended', () => {
      alert('Session ended by producer');
      location.reload();
    });

    async function checkSessionAndJoin() {
      const code = document.getElementById('codeInput').value.trim().toUpperCase();
      
      if (!code) {
        document.getElementById('error').textContent = 'Please enter session code';
        return;
      }
      
      try {
        const response = await fetch(`/api/session/${code}`);
        const data = await response.json();
        
        if (!response.ok) {
          document.getElementById('error').textContent = data.error || 'Session not found';
          return;
        }
        
        requireName = data.requireName;
        
        if (requireName) {
          const nameFieldContainer = document.getElementById('nameFieldContainer');
          if (nameFieldContainer.style.display === 'block') {
            joinSession(code);
          } else {
            nameFieldContainer.style.display = 'block';
            document.getElementById('error').textContent = '';
          }
        } else {
          joinSession(code);
        }
      } catch (error) {
        console.error('Session check error:', error);
        document.getElementById('error').textContent = 'Network error';
      }
    }

    function joinSession(code) {
      if (!code) {
        code = document.getElementById('codeInput').value.trim().toUpperCase();
      }
      
      let displayName = '';
      const nameField = document.getElementById('displayNameInput');
      
      if (requireName) {
        displayName = nameField.value.trim();
        if (!displayName) {
          document.getElementById('error').textContent = 'Please enter your name';
          return;
        }
      } else {
        displayName = nameField.value.trim();
      }
      
      document.getElementById('error').textContent = '';
      socket.emit('join-session', { code, role: 'clicker', displayName });
    }

    function closeNameModal() {
      document.getElementById('nameModal').classList.remove('active');
    }

    function submitNameFromModal() {
      const name = document.getElementById('modalNameInput').value.trim();
      
      if (!name) {
        alert('Please enter a name');
        return;
      }
      
      if (sessionCode && clickerToken) {
        socket.emit('set-display-name', { 
          code: sessionCode, 
          token: clickerToken, 
          displayName: name 
        });
      }
    }

    function sendCommand(direction) {
      if (sessionCode && clickerToken) {
        socket.emit(direction, { code: sessionCode, token: clickerToken });
      }
    }

    function updateLockStatus(locked) {
      updateButtonStates(locked, clickAccessEnabled);
    }

    function updateClickAccessStatus() {
      const status = document.getElementById('lockStatus');
      const prevBtn = document.getElementById('prevBtn');
      const nextBtn = document.getElementById('nextBtn');
      
      const globalLocked = prevBtn.disabled && status.textContent === 'Locked';
      updateButtonStates(globalLocked, clickAccessEnabled);
    }

    function updateButtonStates(globalLocked, accessEnabled) {
      const status = document.getElementById('lockStatus');
      const prevBtn = document.getElementById('prevBtn');
      const nextBtn = document.getElementById('nextBtn');
      
      if (globalLocked) {
        status.textContent = 'Locked';
        status.className = 'status locked';
        prevBtn.disabled = true;
        nextBtn.disabled = true;
      } else if (!accessEnabled) {
        status.textContent = 'Access Suspended';
        status.className = 'status locked';
        prevBtn.disabled = true;
        nextBtn.disabled = true;
      } else {
        status.textContent = 'Ready';
        status.className = 'status unlocked';
        prevBtn.disabled = false;
        nextBtn.disabled = false;
      }
    }

    function updateNotes(notes) {
      const notesSection = document.getElementById('notesSection');
      const notesContent = document.getElementById('notesContent');
      
      if (notes && notes.trim()) {
        notesContent.textContent = notes;
        notesSection.style.display = 'block';
      } else {
        notesSection.style.display = 'none';
      }
    }

    function updateClock() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      document.getElementById('clock').textContent = `${hours}:${minutes}:${seconds}`;
    }

    function updateTimerDisplay() {
      const display = document.getElementById('timer');
      
      if (!timerEndTime) {
        display.textContent = 'No timer set';
        display.className = 'timer idle';
        return;
      }
      
      const remaining = Math.max(0, timerEndTime - Date.now());
      const totalSeconds = Math.floor(remaining / 1000);
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = totalSeconds % 60;
      
      display.textContent = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
      
      display.className = 'timer';
      if (remaining === 0) {
        display.className = 'timer danger';
        if (timerInterval) {
          clearInterval(timerInterval);
          timerInterval = null;
        }
      } else if (remaining < 60000) {
        display.className = 'timer danger';
      } else if (remaining < 300000) {
        display.className = 'timer warning';
      }
    }

    function updateFeatureButtons() {
      const featureButtons = document.getElementById('featureButtons');
      const screenshotBtn = document.getElementById('screenshotBtn');
      const laserBtn = document.getElementById('laserBtn');
      const voiceBtn = document.getElementById('voiceBtn');
      
      const hasFeatures = features.screenshotEnabled || features.laserPointerEnabled || features.voiceControlEnabled;
      featureButtons.style.display = hasFeatures ? 'flex' : 'none';
      
      screenshotBtn.style.display = features.screenshotEnabled ? 'block' : 'none';
      laserBtn.style.display = features.laserPointerEnabled ? 'block' : 'none';
      voiceBtn.style.display = features.voiceControlEnabled ? 'block' : 'none';
    }

    function updateScreenshot(screenshot) {
      if (screenshot && screenshotVisible) {
        document.getElementById('screenshotImg').src = screenshot;
      }
    }

    function toggleScreenshot() {
      screenshotVisible = !screenshotVisible;
      const panel = document.getElementById('screenshotPanel');
      const btn = document.getElementById('screenshotBtn');
      
      panel.style.display = screenshotVisible ? 'block' : 'none';
      if (screenshotVisible) {
        btn.classList.add('active');
      } else {
        btn.classList.remove('active');
      }
    }

    function toggleLaser() {
      laserActive = !laserActive;
      const btn = document.getElementById('laserBtn');
      
      if (laserActive) {
        btn.classList.add('active');
        document.addEventListener('mousemove', handleLaserMove);
        document.addEventListener('touchmove', handleLaserMove);
      } else {
        btn.classList.remove('active');
        document.removeEventListener('mousemove', handleLaserMove);
        document.removeEventListener('touchmove', handleLaserMove);
        socket.emit('laser-pointer', { code: sessionCode, token: clickerToken, x: 0, y: 0, active: false });
      }
    }

    function handleLaserMove(e) {
      if (!laserActive) return;
      
      let x, y;
      if (e.type.startsWith('touch')) {
        const touch = e.touches[0];
        x = touch.clientX / window.innerWidth;
        y = touch.clientY / window.innerHeight;
      } else {
        x = e.clientX / window.innerWidth;
        y = e.clientY / window.innerHeight;
      }
      
      socket.emit('laser-pointer', { code: sessionCode, token: clickerToken, x, y, active: true });
    }

    function toggleVoice() {
      voiceActive = !voiceActive;
      const btn = document.getElementById('voiceBtn');
      
      if (voiceActive) {
        btn.classList.add('active');
        startVoiceRecognition();
      } else {
        btn.classList.remove('active');
        stopVoiceRecognition();
      }
    }

    function startVoiceRecognition() {
      if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
        alert('Voice recognition not supported in this browser');
        voiceActive = false;
        document.getElementById('voiceBtn').classList.remove('active');
        return;
      }
      
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = false;
      recognition.lang = 'en-US';
      
      recognition.onresult = (event) => {
        const last = event.results.length - 1;
        const text = event.results[last][0].transcript.toLowerCase().trim();
        
        console.log('Voice recognized:', text);
        
        if (text.includes('next') && text.includes('slide')) {
          sendCommand('next');
        } else if (text.includes('last') && text.includes('slide') || text.includes('previous') && text.includes('slide')) {
          sendCommand('prev');
        }
      };
      
      recognition.onerror = (event) => {
        console.error('Voice recognition error:', event.error);
      };
      
      recognition.onend = () => {
        if (voiceActive) {
          recognition.start();
        }
      };
      
      recognition.start();
    }

    function stopVoiceRecognition() {
      if (recognition) {
        recognition.stop();
        recognition = null;
      }
    }

    function showMessage(message) {
      document.getElementById('messageText').textContent = message;
      document.getElementById('messageModal').classList.add('active');
    }

    function closeMessageModal() {
      document.getElementById('messageModal').classList.remove('active');
    }

    document.getElementById('displayNameInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        const code = document.getElementById('codeInput').value.trim().toUpperCase();
        if (code) {
          joinSession(code);
        }
      }
    });

    document.getElementById('codeInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        checkSessionAndJoin();
      }
    });

    document.getElementById('modalNameInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        submitNameFromModal();
      }
    });

    // Auto-join if code is in URL
    const urlParams = new URLSearchParams(window.location.search);
    const urlCode = urlParams.get('code');
    if (urlCode) {
      document.getElementById('codeInput').value = urlCode.toUpperCase();
      checkSessionAndJoin();
    }
  </script>
</body>
</html>
