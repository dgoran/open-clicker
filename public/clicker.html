<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1a1a1a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Clicker - Open Clicker</title>
  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    html {
      height: 100%;
      overflow: hidden;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a1a;
      color: white;
      height: 100%;
      overflow: hidden;
      touch-action: manipulation;
      position: fixed;
      width: 100%;
    }
    #join-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding: max(20px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
    }
    h1 {
      margin-bottom: 24px;
      font-size: clamp(24px, 6vw, 32px);
    }
    .join-form {
      background: #2a2a2a;
      padding: 24px;
      border-radius: 16px;
      width: 100%;
      max-width: 400px;
    }
    input[type="text"] {
      width: 100%;
      padding: 16px;
      font-size: 20px;
      border: 2px solid #444;
      border-radius: 12px;
      background: #1a1a1a;
      color: white;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 16px;
    }
    input[type="text"]:focus {
      outline: none;
      border-color: #667eea;
    }
    .button {
      width: 100%;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 12px;
      padding: 16px;
      font-size: 18px;
      cursor: pointer;
      transition: all 0.2s;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      min-height: 48px;
    }
    .button:active {
      transform: scale(0.98);
    }
    #clicker-screen {
      display: none;
      height: 100vh;
      height: 100dvh;
      flex-direction: column;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }
    .header {
      padding: 16px max(16px, env(safe-area-inset-left)) 16px max(16px, env(safe-area-inset-right));
      text-align: center;
      background: #2a2a2a;
      flex-shrink: 0;
    }
    .session-info {
      font-size: 12px;
      color: #999;
    }
    .session-code {
      font-size: clamp(20px, 5vw, 24px);
      font-weight: bold;
      color: #667eea;
      font-family: 'Courier New', monospace;
      margin: 6px 0;
    }
    .status {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      margin-top: 4px;
    }
    .status.locked {
      background: #dc3545;
    }
    .status.unlocked {
      background: #28a745;
    }
    .time-display {
      margin: 10px 0 6px;
    }
    .clock {
      font-size: clamp(20px, 5vw, 24px);
      font-weight: 600;
      font-family: 'Courier New', monospace;
      color: #999;
      margin-bottom: 4px;
    }
    .timer {
      font-size: clamp(32px, 8vw, 42px);
      font-weight: bold;
      font-family: 'Courier New', monospace;
      color: #667eea;
    }
    .timer.idle {
      font-size: clamp(18px, 4.5vw, 22px);
      color: #555;
    }
    .timer.warning { color: #ffc107; }
    .timer.danger { color: #dc3545; }
    .controls {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
      min-height: 0;
      overflow: hidden;
    }
    .control-button {
      background: #2a2a2a;
      border: 2px solid #1a1a1a;
      color: white;
      font-size: clamp(32px, 8vw, 48px);
      font-weight: bold;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-user-select: none;
      min-height: 120px;
      touch-action: manipulation;
    }
    .control-button.prev-button {
      background: #dc3545;
      border-color: #a02834;
    }
    .control-button.prev-button:active {
      background: #c82333;
      transform: scale(0.98);
    }
    .control-button.next-button {
      background: #28a745;
      border-color: #1e7e34;
    }
    .control-button.next-button:active {
      background: #218838;
      transform: scale(0.98);
    }
    .control-button:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }
    .control-button:disabled:active {
      background: inherit;
      transform: none;
    }
    .notes {
      padding: 14px max(16px, env(safe-area-inset-left)) 14px max(16px, env(safe-area-inset-right));
      background: #2a2a2a;
      max-height: 160px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      border-top: 2px solid #1a1a1a;
      flex-shrink: 0;
    }
    .notes-title {
      font-size: 11px;
      color: #999;
      text-transform: uppercase;
      margin-bottom: 6px;
      font-weight: 600;
    }
    .notes-content {
      font-size: 14px;
      line-height: 1.5;
      color: #ccc;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .error {
      color: #dc3545;
      margin-top: 12px;
      text-align: center;
      font-size: 14px;
    }
    @media (max-width: 400px) {
      .join-form {
        padding: 20px;
      }
      .header {
        padding: 12px max(12px, env(safe-area-inset-left)) 12px max(12px, env(safe-area-inset-right));
      }
    }
  </style>
</head>
<body>
  <div id="join-screen">
    <h1>🎯 Clicker</h1>
    <div class="join-form">
      <input type="text" id="codeInput" placeholder="Enter Code" autocomplete="off">
      <button class="button" onclick="joinSession()">Join Session</button>
      <div class="error" id="error"></div>
    </div>
  </div>

  <div id="clicker-screen">
    <div class="header">
      <div class="session-info">Session</div>
      <div class="session-code" id="sessionCode"></div>
      <div>
        <span class="status unlocked" id="lockStatus">Ready</span>
      </div>
      <div class="time-display">
        <div class="clock" id="clock">--:--:--</div>
        <div class="timer idle" id="timer">No timer set</div>
      </div>
    </div>
    
    <div class="controls">
      <button class="control-button prev-button" id="prevBtn" ontouchstart="sendCommand('prev')" onclick="sendCommand('prev')">
        ← PREV
      </button>
      <button class="control-button next-button" id="nextBtn" ontouchstart="sendCommand('next')" onclick="sendCommand('next')">
        NEXT →
      </button>
    </div>

    <div class="notes" id="notesSection" style="display: none;">
      <div class="notes-title">Speaker Notes</div>
      <div class="notes-content" id="notesContent"></div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let sessionCode = null;
    let clickerToken = null;
    let wakeLock = null;
    let timerInterval = null;
    let timerEndTime = null;
    let clockInterval = null;

    async function requestWakeLock() {
      if ('wakeLock' in navigator) {
        try {
          wakeLock = await navigator.wakeLock.request('screen');
          console.log('Wake lock activated');
          
          wakeLock.addEventListener('release', () => {
            console.log('Wake lock released');
          });
        } catch (err) {
          console.error('Wake lock error:', err);
        }
      }
    }

    document.addEventListener('visibilitychange', async () => {
      if (wakeLock !== null && document.visibilityState === 'visible') {
        await requestWakeLock();
      }
    });

    socket.on('session-joined', (data) => {
      sessionCode = data.code;
      clickerToken = data.token;
      document.getElementById('sessionCode').textContent = data.code;
      document.getElementById('join-screen').style.display = 'none';
      document.getElementById('clicker-screen').style.display = 'flex';
      
      if (data.locked !== undefined) {
        updateLockStatus(data.locked);
      }
      
      if (data.notes) {
        updateNotes(data.notes);
      }

      if (data.timer && data.timerStartedAt) {
        timerEndTime = data.timerStartedAt + (data.timer * 1000);
        updateTimerDisplay();
        timerInterval = setInterval(updateTimerDisplay, 100);
      } else {
        updateTimerDisplay();
      }
      
      updateClock();
      clockInterval = setInterval(updateClock, 1000);
      
      requestWakeLock();
    });

    socket.on('lock-changed', ({ locked }) => {
      updateLockStatus(locked);
    });

    socket.on('notes-changed', ({ notes }) => {
      updateNotes(notes);
    });

    socket.on('timer-changed', ({ timer, timerStartedAt }) => {
      timerEndTime = timerStartedAt + (timer * 1000);
      updateTimerDisplay();
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(updateTimerDisplay, 100);
    });

    socket.on('error', ({ message }) => {
      document.getElementById('error').textContent = message;
    });

    socket.on('session-ended', () => {
      alert('Session ended by producer');
      location.reload();
    });

    function joinSession() {
      const code = document.getElementById('codeInput').value.trim().toUpperCase();
      if (code) {
        socket.emit('join-session', { code, role: 'clicker' });
      }
    }

    function sendCommand(direction) {
      if (sessionCode && clickerToken) {
        socket.emit(direction, { code: sessionCode, token: clickerToken });
      }
    }

    function updateLockStatus(locked) {
      const status = document.getElementById('lockStatus');
      const prevBtn = document.getElementById('prevBtn');
      const nextBtn = document.getElementById('nextBtn');
      
      if (locked) {
        status.textContent = 'Locked';
        status.className = 'status locked';
        prevBtn.disabled = true;
        nextBtn.disabled = true;
      } else {
        status.textContent = 'Ready';
        status.className = 'status unlocked';
        prevBtn.disabled = false;
        nextBtn.disabled = false;
      }
    }

    function updateNotes(notes) {
      const notesSection = document.getElementById('notesSection');
      const notesContent = document.getElementById('notesContent');
      
      if (notes && notes.trim()) {
        notesContent.textContent = notes;
        notesSection.style.display = 'block';
      } else {
        notesSection.style.display = 'none';
      }
    }

    function updateClock() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      document.getElementById('clock').textContent = `${hours}:${minutes}:${seconds}`;
    }

    function updateTimerDisplay() {
      const display = document.getElementById('timer');
      
      if (!timerEndTime) {
        display.textContent = 'No timer set';
        display.className = 'timer idle';
        return;
      }
      
      const remaining = Math.max(0, timerEndTime - Date.now());
      const totalSeconds = Math.floor(remaining / 1000);
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = totalSeconds % 60;
      
      display.textContent = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
      
      display.className = 'timer';
      if (remaining === 0) {
        display.className = 'timer danger';
        if (timerInterval) {
          clearInterval(timerInterval);
          timerInterval = null;
        }
      } else if (remaining < 60000) {
        display.className = 'timer danger';
      } else if (remaining < 300000) {
        display.className = 'timer warning';
      }
    }

    document.getElementById('codeInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        joinSession();
      }
    });
  </script>
</body>
</html>
