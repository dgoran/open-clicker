<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1a1a1a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Clicker - Open Clicker</title>
  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    html {
      height: 100%;
      overflow: hidden;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a1a;
      color: white;
      height: 100%;
      overflow: hidden;
      touch-action: manipulation;
      position: fixed;
      width: 100%;
    }
    #join-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding: max(20px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
    }
    h1 {
      margin-bottom: 24px;
      font-size: clamp(24px, 6vw, 32px);
    }
    .join-form {
      background: #2a2a2a;
      padding: 24px;
      border-radius: 16px;
      width: 100%;
      max-width: 400px;
    }
    input[type="text"] {
      width: 100%;
      padding: 16px;
      font-size: 20px;
      border: 2px solid #444;
      border-radius: 12px;
      background: #1a1a1a;
      color: white;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 16px;
    }
    input[type="text"]:focus {
      outline: none;
      border-color: #667eea;
    }
    .button {
      width: 100%;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 12px;
      padding: 16px;
      font-size: 18px;
      cursor: pointer;
      transition: all 0.2s;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      min-height: 48px;
    }
    .button:active {
      transform: scale(0.98);
    }
    #clicker-screen {
      display: none;
      height: 100vh;
      height: 100dvh;
      flex-direction: column;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }
    .header {
      padding: 16px max(16px, env(safe-area-inset-left)) 16px max(16px, env(safe-area-inset-right));
      text-align: center;
      background: #2a2a2a;
      flex-shrink: 0;
      overflow: hidden;
    }
    .session-info {
      font-size: 12px;
      color: #999;
    }
    .session-code {
      font-size: clamp(20px, 5vw, 24px);
      font-weight: bold;
      color: #667eea;
      font-family: 'Courier New', monospace;
      margin: 6px 0;
    }
    .status {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      margin-top: 4px;
    }
    .status.locked {
      background: #dc3545;
    }
    .status.unlocked {
      background: #28a745;
    }
    .time-display {
      margin: 10px 0 6px;
    }
    .clock {
      font-size: clamp(20px, 5vw, 24px);
      font-weight: 600;
      font-family: 'Courier New', monospace;
      color: #999;
      margin-bottom: 4px;
    }
    .timer {
      font-size: clamp(32px, 8vw, 42px);
      font-weight: bold;
      font-family: 'Courier New', monospace;
      color: #667eea;
    }
    .timer.idle {
      font-size: clamp(18px, 4.5vw, 22px);
      color: #555;
    }
    .timer.warning { color: #ffc107; }
    .timer.danger { color: #dc3545; }
    .controls {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
      min-height: 0;
      overflow: hidden;
    }
    .control-button {
      background: #2a2a2a;
      border: 2px solid #1a1a1a;
      color: white;
      font-size: clamp(32px, 8vw, 48px);
      font-weight: bold;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-user-select: none;
      min-height: 0;
      touch-action: manipulation;
    }
    .control-button.prev-button {
      background: #dc3545;
      border-color: #a02834;
    }
    .control-button.prev-button:active {
      background: #c82333;
      transform: scale(0.98);
    }
    .control-button.next-button {
      background: #28a745;
      border-color: #1e7e34;
    }
    .control-button.next-button:active {
      background: #218838;
      transform: scale(0.98);
    }
    .control-button:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }
    .control-button:disabled:active {
      background: inherit;
      transform: none;
    }
    .notes {
      padding: 14px max(16px, env(safe-area-inset-left)) 10px max(16px, env(safe-area-inset-right));
      background: #2a2a2a;
      height: 160px;
      border-top: 2px solid #1a1a1a;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .notes-scroll {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .notes-size {
      flex-shrink: 0;
      display: flex;
      gap: 6px;
      padding-top: 6px;
    }
    .notes-title {
      font-size: 11px;
      color: #999;
      text-transform: uppercase;
      margin-bottom: 6px;
      font-weight: 600;
    }
    .notes-content {
      min-height: 21px;
      font-size: 14px;
      line-height: 1.5;
      color: #ccc;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .error {
      color: #dc3545;
      margin-top: 12px;
      text-align: center;
      font-size: 14px;
    }
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal.active {
      display: flex;
    }
    .modal-content {
      background: #2a2a2a;
      border-radius: 16px;
      padding: 24px;
      max-width: 400px;
      width: 100%;
      text-align: center;
    }
    .modal-content h2 {
      margin-bottom: 16px;
      font-size: 22px;
    }
    .modal-content input[type="text"] {
      width: 100%;
      padding: 14px;
      font-size: 18px;
      border: 2px solid #444;
      border-radius: 12px;
      background: #1a1a1a;
      color: white;
      text-align: center;
      margin-bottom: 16px;
      text-transform: none;
      letter-spacing: normal;
    }
    .modal-content input[type="text"]:focus {
      outline: none;
      border-color: #667eea;
    }
    .modal-content .button {
      width: 100%;
      margin-bottom: 8px;
    }
    .modal-content .button.secondary {
      background: #6c757d;
    }
    .modal-content .button.secondary:active {
      background: #5a6268;
    }
    .screenshot-panel {
      background: #2a2a2a;
      border-top: 2px solid #1a1a1a;
      padding: 14px max(16px, env(safe-area-inset-left)) 14px max(16px, env(safe-area-inset-right));
      height: 190px;
      overflow: hidden;
      flex-direction: column;
      flex-shrink: 0;
      display: none;
    }
    .screenshot-title {
      font-size: 11px;
      color: #999;
      text-transform: uppercase;
      margin-bottom: 6px;
      font-weight: 600;
    }
    .screenshot-container {
      width: 100%;
      flex: 1;
      min-height: 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .screenshot-empty {
      color: #6b6f7d;
      font-size: 12px;
      text-align: center;
    }
    .screenshot-container img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 8px;
      border: 1px solid #444;
    }
    .header {
      position: relative;
    }
    .settings-cog {
      position: absolute;
      top: 10px;
      right: max(10px, env(safe-area-inset-right));
      width: 40px;
      height: 40px;
      border-radius: 10px;
      border: none;
      background: transparent;
      color: #bbb;
      font-size: 22px;
      line-height: 1;
      cursor: pointer;
      touch-action: manipulation;
    }
    .settings-cog:active { background: #3a3a3a; }
    .settings-panel {
      display: none;
      background: #23252e;
      border-top: 2px solid #1a1a1a;
      border-bottom: 2px solid #1a1a1a;
      padding: 6px max(16px, env(safe-area-inset-left)) 10px max(16px, env(safe-area-inset-right));
      flex-shrink: 0;
    }
    .settings-panel.open { display: block; }
    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid #31343f;
    }
    .setting-row:last-child { border-bottom: none; }
    .setting-label {
      font-size: 14px;
      color: #e2e4ec;
      font-weight: 500;
    }
    .setting-note {
      display: block;
      font-size: 11px;
      color: #8a8d9e;
      font-weight: 400;
      margin-top: 2px;
    }
    .toggle {
      flex: 0 0 auto;
      min-width: 62px;
      padding: 6px 0;
      border-radius: 999px;
      border: none;
      background: #4a4d5a;
      color: white;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      touch-action: manipulation;
    }
    .toggle.on { background: #28a745; }
    .size-arrow {
      width: 30px;
      height: 26px;
      border-radius: 6px;
      border: none;
      background: #3a3d48;
      color: #b9bcc9;
      font-size: 10px;
      line-height: 1;
      cursor: pointer;
      touch-action: manipulation;
    }
    .size-arrow:active { background: #667eea; color: white; }
    .size-arrow:disabled { opacity: 0.35; cursor: default; }
    .resize-handle {
      flex-shrink: 0;
      height: 16px;
      background: #23252e;
      cursor: ns-resize;
      touch-action: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .resize-handle::after {
      content: '';
      width: 44px;
      height: 4px;
      border-radius: 2px;
      background: #565a6b;
    }
    .resize-handle:active::after { background: #667eea; }
    .message-modal .modal-content {
      max-height: 80vh;
      overflow-y: auto;
    }
    .message-text {
      background: #1a1a1a;
      padding: 16px;
      border-radius: 8px;
      margin: 16px 0;
      font-size: 16px;
      line-height: 1.5;
    }
    .voice-status {
      font-size: 12px;
      color: #999;
      margin-top: 4px;
    }
    .voice-status.listening {
      color: #28a745;
    }
    @media (max-width: 400px) {
      .join-form {
        padding: 20px;
      }
      .header {
        padding: 12px max(12px, env(safe-area-inset-left)) 12px max(12px, env(safe-area-inset-right));
      }
    }
  </style>
</head>
<body>
  <div id="join-screen">
    <h1>🎯 Clicker</h1>
    <div class="join-form">
      <input type="text" id="codeInput" placeholder="Session Code" autocomplete="off">
      <div id="nameFieldContainer" style="display: none;">
        <input type="text" id="displayNameInput" placeholder="Your Name" autocomplete="off" style="text-transform: none; letter-spacing: normal;">
      </div>
      <button class="button" onclick="checkSessionAndJoin()">Join Session</button>
      <div class="error" id="error"></div>
    </div>
  </div>

  <div id="clicker-screen">
    <div class="header" id="headerSection">
      <button class="settings-cog" id="settingsCog" onclick="toggleSettings()" aria-label="Settings">&#9881;</button>
      <div class="session-info">Session</div>
      <div class="session-code" id="sessionCode"></div>
      <div>
        <span class="status unlocked" id="lockStatus">Ready</span>
      </div>
      <div class="time-display">
        <div class="clock" id="clock">--:--:--</div>
        <div class="timer idle" id="timer">No timer set</div>
      </div>
    </div>
    <div class="resize-handle" id="headerResize" title="Drag to resize"></div>

    <div class="settings-panel" id="settingsPanel">
      <div class="setting-row" id="row-screenshot">
        <span class="setting-label">Show screenshot</span>
        <button class="toggle" id="toggle-screenshot" onclick="toggleScreenshot()">Off</button>
      </div>
      <div class="setting-row" id="row-laser">
        <span class="setting-label">Laser pointer</span>
        <button class="toggle" id="toggle-laser" onclick="toggleLaser()">Off</button>
      </div>
      <div class="setting-row" id="row-voice">
        <span class="setting-label">Voice control</span>
        <button class="toggle" id="toggle-voice" onclick="toggleVoice()">Off</button>
      </div>
      <div class="setting-row" id="row-wake">
        <span class="setting-label">Keep screen awake
          <span class="setting-note" id="wakeNote"></span>
        </span>
        <button class="toggle on" id="toggle-wake" onclick="toggleWakeLock()">On</button>
      </div>
      <div class="setting-row" id="row-notes">
        <span class="setting-label">Show speaker notes
          <span class="setting-note">Sent by the show machine</span>
        </span>
        <button class="toggle on" id="toggle-notes" onclick="toggleNotes()">On</button>
      </div>
    </div>
    
    <div class="screenshot-panel" id="screenshotPanel">
      <div class="screenshot-title">Live Slide Preview</div>
      <div class="screenshot-container">
        <img id="screenshotImg" alt="Slide preview" style="display: none;">
        <div class="screenshot-empty" id="screenshotEmpty">Waiting for the show machine…</div>
      </div>
    </div>
    
    <div class="resize-handle" id="screenshotResize" title="Drag to resize" style="display: none;"></div>

    <div class="controls">
      <button class="control-button prev-button" id="prevBtn" onclick="sendCommand('prev')">
        ← PREV
      </button>
      <button class="control-button next-button" id="nextBtn" onclick="sendCommand('next')">
        NEXT →
      </button>
    </div>

    <div class="resize-handle" id="notesResize" title="Drag to resize" style="display: none;"></div>
    <div class="notes" id="notesSection" style="display: none;">
      <div class="notes-title">Speaker Notes</div>
      <div class="notes-scroll">
        <div class="notes-content" id="notesContent"></div>
      </div>
      <div class="notes-size">
        <button class="size-arrow" id="notesSizeDown" onclick="changeNotesSize(-1)" aria-label="Smaller notes text">&#9660;</button>
        <button class="size-arrow" id="notesSizeUp" onclick="changeNotesSize(1)" aria-label="Larger notes text">&#9650;</button>
      </div>
    </div>
  </div>

  <div class="modal" id="nameModal">
    <div class="modal-content">
      <h2>Enter Your Name</h2>
      <p style="color: #ccc; margin-bottom: 16px; font-size: 14px;">The presenter would like you to provide your name</p>
      <input type="text" id="modalNameInput" placeholder="Your Name" autocomplete="off">
      <button class="button" onclick="submitNameFromModal()">Submit</button>
      <button class="button secondary" onclick="closeNameModal()">Maybe Later</button>
    </div>
  </div>

  <div class="modal message-modal" id="messageModal">
    <div class="modal-content">
      <h2>💬 Speaker Chat</h2>
      <div class="message-text" id="messageText"></div>
      <button class="button" onclick="closeMessageModal()">OK</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let sessionCode = null;
    let clickerToken = null;
    let clickAccessEnabled = true;
    let wakeLock = null;
    let timerInterval = null;
    let timerEndTime = null;
    let clockInterval = null;
    let requireName = false;
    let features = {};
    let screenshotVisible = false;
    let showNotesPref = localStorage.getItem('oc-show-notes') !== '0';
    let notesFontPx = parseInt(localStorage.getItem('oc-notes-font'), 10) || 14;
    let wakeLockPref = localStorage.getItem('oc-wake-lock') !== '0';
    let laserActive = false;
    let voiceActive = false;
    let recognition = null;

    // Reports why the screen may still sleep, rather than showing "On" for a
    // lock the browser never granted.
    function setWakeNote(text) {
      const note = document.getElementById('wakeNote');
      if (note) note.textContent = text;
    }

    async function requestWakeLock() {
      if (!wakeLockPref) return;

      if (!('wakeLock' in navigator)) {
        // The API is secure-context only, so plain http over a LAN address
        // has no wake lock at all.
        setWakeNote(window.isSecureContext
          ? 'Not supported by this browser'
          : 'Needs an https:// address');
        return;
      }

      try {
        wakeLock = await navigator.wakeLock.request('screen');
        setWakeNote('');
        console.log('Wake lock activated');

        wakeLock.addEventListener('release', () => {
          console.log('Wake lock released');
        });
      } catch (err) {
        wakeLock = null;
        setWakeNote('Blocked by the browser');
        console.error('Wake lock error:', err);
      }
    }

    document.addEventListener('visibilitychange', async () => {
      if (wakeLock !== null && document.visibilityState === 'visible') {
        await requestWakeLock();
      }
    });

    socket.on('session-joined', (data) => {
      sessionCode = data.code;
      clickerToken = data.token;
      clickAccessEnabled = data.clickAccessEnabled !== undefined ? data.clickAccessEnabled : true;
      features = data.features || {};
      
      document.getElementById('sessionCode').textContent = data.code;
      document.getElementById('join-screen').style.display = 'none';
      document.getElementById('clicker-screen').style.display = 'flex';
      
      if (data.locked !== undefined) {
        updateLockStatus(data.locked);
      }
      
      updateClickAccessStatus();
      updateFeatureButtons();
      
      // Always call through, so the panel shows (blank) when the producer has
      // speaker notes enabled but the current slide has none.
      updateNotes(data.notes);

      if (data.timer && data.timerStartedAt) {
        timerEndTime = data.timerStartedAt + (data.timer * 1000);
        updateTimerDisplay();
        timerInterval = setInterval(updateTimerDisplay, 100);
      } else {
        updateTimerDisplay();
      }
      
      if (data.screenshot) {
        updateScreenshot(data.screenshot);
      }
      
      updateClock();
      clockInterval = setInterval(updateClock, 1000);
      
      requestWakeLock();
    });

    socket.on('name-prompt', () => {
      document.getElementById('nameModal').classList.add('active');
    });

    socket.on('display-name-updated', ({ displayName }) => {
      console.log('Display name updated to:', displayName);
      closeNameModal();
    });

    socket.on('lock-changed', ({ locked }) => {
      updateLockStatus(locked);
    });

    socket.on('click-access-changed', ({ clickAccessEnabled: enabled }) => {
      clickAccessEnabled = enabled;
      updateClickAccessStatus();
    });

    socket.on('notes-changed', ({ notes }) => {
      updateNotes(notes);
    });

    socket.on('timer-changed', ({ timer, timerStartedAt }) => {
      timerEndTime = timerStartedAt + (timer * 1000);
      updateTimerDisplay();
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(updateTimerDisplay, 100);
    });

    socket.on('features-changed', ({ features: newFeatures }) => {
      features = { ...features, ...newFeatures };
      updateFeatureButtons();
      applyNotesVisibility();
    });

    socket.on('screenshot-updated', ({ screenshot }) => {
      updateScreenshot(screenshot);
    });

    socket.on('message-received', ({ message, timestamp, from }) => {
      showMessage(message);
    });

    socket.on('error', ({ message }) => {
      document.getElementById('error').textContent = message;
    });

    socket.on('session-ended', () => {
      alert('Session ended by producer');
      location.reload();
    });

    async function checkSessionAndJoin() {
      const code = document.getElementById('codeInput').value.trim().toUpperCase();
      
      if (!code) {
        document.getElementById('error').textContent = 'Please enter session code';
        return;
      }
      
      try {
        const response = await fetch(`/api/session/${code}`);
        const data = await response.json();
        
        if (!response.ok) {
          document.getElementById('error').textContent = data.error || 'Session not found';
          return;
        }
        
        requireName = data.requireName;
        
        if (requireName) {
          const nameFieldContainer = document.getElementById('nameFieldContainer');
          if (nameFieldContainer.style.display === 'block') {
            joinSession(code);
          } else {
            nameFieldContainer.style.display = 'block';
            document.getElementById('error').textContent = '';
          }
        } else {
          joinSession(code);
        }
      } catch (error) {
        console.error('Session check error:', error);
        document.getElementById('error').textContent = 'Network error';
      }
    }

    function joinSession(code) {
      if (!code) {
        code = document.getElementById('codeInput').value.trim().toUpperCase();
      }
      
      let displayName = '';
      const nameField = document.getElementById('displayNameInput');
      
      if (requireName) {
        displayName = nameField.value.trim();
        if (!displayName) {
          document.getElementById('error').textContent = 'Please enter your name';
          return;
        }
      } else {
        displayName = nameField.value.trim();
      }
      
      document.getElementById('error').textContent = '';
      socket.emit('join-session', { code, role: 'clicker', displayName });
    }

    function closeNameModal() {
      document.getElementById('nameModal').classList.remove('active');
    }

    function submitNameFromModal() {
      const name = document.getElementById('modalNameInput').value.trim();
      
      if (!name) {
        alert('Please enter a name');
        return;
      }
      
      if (sessionCode && clickerToken) {
        socket.emit('set-display-name', { 
          code: sessionCode, 
          token: clickerToken, 
          displayName: name 
        });
      }
    }

    function sendCommand(direction) {
      if (sessionCode && clickerToken) {
        socket.emit(direction, { code: sessionCode, token: clickerToken });
      }
    }

    function updateLockStatus(locked) {
      updateButtonStates(locked, clickAccessEnabled);
    }

    function updateClickAccessStatus() {
      const status = document.getElementById('lockStatus');
      const prevBtn = document.getElementById('prevBtn');
      const nextBtn = document.getElementById('nextBtn');
      
      const globalLocked = prevBtn.disabled && status.textContent === 'Locked';
      updateButtonStates(globalLocked, clickAccessEnabled);
    }

    function updateButtonStates(globalLocked, accessEnabled) {
      const status = document.getElementById('lockStatus');
      const prevBtn = document.getElementById('prevBtn');
      const nextBtn = document.getElementById('nextBtn');
      
      if (globalLocked) {
        status.textContent = 'Locked';
        status.className = 'status locked';
        prevBtn.disabled = true;
        nextBtn.disabled = true;
      } else if (!accessEnabled) {
        status.textContent = 'Access Suspended';
        status.className = 'status locked';
        prevBtn.disabled = true;
        nextBtn.disabled = true;
      } else {
        status.textContent = 'Ready';
        status.className = 'status unlocked';
        prevBtn.disabled = false;
        nextBtn.disabled = false;
      }
    }

    function updateNotes(notes) {
      document.getElementById('notesContent').textContent = notes || '';
      applyNotesVisibility();
    }

    // Visibility follows the producer's speaker-notes toggle, so the panel
    // stays put (blank) on slides with no notes instead of appearing and
    // vanishing as the deck moves. Producer-typed notes still show it when
    // the toggle is off.
    // Shows or hides a resizable panel together with its drag handle. The
    // click buttons get re-budgeted only when visibility actually changes.
    function setPanelVisible(panelId, handleId, visible) {
      const panel = document.getElementById(panelId);
      // Computed, not inline: the initial hidden state can come from the
      // stylesheet, where the inline style is still empty.
      const wasVisible = getComputedStyle(panel).display !== 'none';
      if (wasVisible === visible) return;
      panel.style.display = visible ? 'flex' : 'none';
      document.getElementById(handleId).style.display = visible ? 'flex' : 'none';
      clampPanels();
    }

    function applyNotesVisibility() {
      const hasText = !!document.getElementById('notesContent').textContent.trim();
      const visible = features.speakerNotesEnabled ? showNotesPref : hasText;
      setPanelVisible('notesSection', 'notesResize', visible);
    }

    function updateClock() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      document.getElementById('clock').textContent = `${hours}:${minutes}:${seconds}`;
    }

    function updateTimerDisplay() {
      const display = document.getElementById('timer');
      
      if (!timerEndTime) {
        display.textContent = 'No timer set';
        display.className = 'timer idle';
        return;
      }
      
      const remaining = Math.max(0, timerEndTime - Date.now());
      const totalSeconds = Math.floor(remaining / 1000);
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = totalSeconds % 60;
      
      display.textContent = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
      
      display.className = 'timer';
      if (remaining === 0) {
        display.className = 'timer danger';
        if (timerInterval) {
          clearInterval(timerInterval);
          timerInterval = null;
        }
      } else if (remaining < 60000) {
        display.className = 'timer danger';
      } else if (remaining < 300000) {
        display.className = 'timer warning';
      }
    }

    // Rows appear only for the features the producer enabled for this session.
    function updateFeatureButtons() {
      document.getElementById('row-screenshot').style.display = features.screenshotEnabled ? 'flex' : 'none';
      document.getElementById('row-laser').style.display = features.laserPointerEnabled ? 'flex' : 'none';
      document.getElementById('row-voice').style.display = features.voiceControlEnabled ? 'flex' : 'none';
      document.getElementById('row-notes').style.display = features.speakerNotesEnabled ? 'flex' : 'none';

      // A feature switched off mid-session must not leave its panel on screen.
      if (!features.screenshotEnabled) setScreenshotVisible(false);
      if (!features.laserPointerEnabled) setLaser(false);
    }

    function setToggle(id, on) {
      const btn = document.getElementById(id);
      btn.textContent = on ? 'On' : 'Off';
      btn.classList.toggle('on', on);
    }

    function toggleSettings() {
      document.getElementById('settingsPanel').classList.toggle('open');
    }

    const NOTES_FONT_MIN = 11;
    // Large enough to read a confidence monitor across a stage at 4K.
    const NOTES_FONT_MAX = 300;
    const NOTES_FONT_RATIO = 1.25;

    function applyNotesFontSize() {
      document.getElementById('notesContent').style.fontSize = notesFontPx + 'px';
      document.getElementById('notesSizeDown').disabled = notesFontPx <= NOTES_FONT_MIN;
      document.getElementById('notesSizeUp').disabled = notesFontPx >= NOTES_FONT_MAX;
    }

    // Proportional steps, so 11px to 300px is about fifteen taps instead of
    // a hundred and fifty, and each tap is a similar visual jump.
    function changeNotesSize(direction) {
      const scaled = direction > 0
        ? Math.round(notesFontPx * NOTES_FONT_RATIO)
        : Math.round(notesFontPx / NOTES_FONT_RATIO);
      // Guarantee movement at small sizes where rounding could stall.
      const stepped = scaled === notesFontPx ? notesFontPx + direction : scaled;

      notesFontPx = Math.min(NOTES_FONT_MAX, Math.max(NOTES_FONT_MIN, stepped));
      localStorage.setItem('oc-notes-font', notesFontPx);
      applyNotesFontSize();
    }

    function toggleNotes() {
      showNotesPref = !showNotesPref;
      setToggle('toggle-notes', showNotesPref);
      localStorage.setItem('oc-show-notes', showNotesPref ? '1' : '0');
      applyNotesVisibility();
    }

    async function toggleWakeLock() {
      wakeLockPref = !wakeLockPref;
      setToggle('toggle-wake', wakeLockPref);
      localStorage.setItem('oc-wake-lock', wakeLockPref ? '1' : '0');

      if (wakeLockPref) {
        requestWakeLock();
      } else if (wakeLock) {
        setWakeNote('');
        try {
          await wakeLock.release();
        } catch (error) {
          console.error('Wake lock release failed:', error);
        }
        wakeLock = null;
      }
    }

    // The click buttons must always keep this much room, however the
    // surrounding panels are sized.
    const CONTROLS_MIN_PX = 140;

    const RESIZABLE_PANELS = ['headerSection', 'screenshotPanel', 'notesSection'];
    const RESIZE_HANDLES = ['headerResize', 'screenshotResize', 'notesResize'];

    function panelHeight(el) {
      return el.style.display === 'none' ? 0 : el.getBoundingClientRect().height;
    }

    // How tall this panel may become given what everything else already takes.
    function maxHeightFor(panel) {
      let others = 0;
      RESIZABLE_PANELS.forEach((id) => {
        const el = document.getElementById(id);
        if (el !== panel) others += panelHeight(el);
      });

      let handles = 0;
      RESIZE_HANDLES.forEach((id) => {
        const el = document.getElementById(id);
        handles += el.style.display === 'none' ? 0 : el.offsetHeight;
      });

      return Math.max(60, window.innerHeight - others - handles - CONTROLS_MIN_PX);
    }

    // A size stored on a roomier screen must not starve the buttons here.
    function clampPanels() {
      RESIZABLE_PANELS.forEach((id) => {
        const panel = document.getElementById(id);
        if (!panel.style.height) return;
        const height = Math.min(parseFloat(panel.style.height), maxHeightFor(panel));
        panel.style.height = height + 'px';
      });
    }

    // Drag the bar to resize the panel above or below it. The controls sit in
    // the flex remainder, so they shrink and grow to match.
    function makeResizable(handleId, panelId, edge, storageKey, minPx) {
      const handle = document.getElementById(handleId);
      const panel = document.getElementById(panelId);

      const saved = localStorage.getItem(storageKey);
      if (saved) panel.style.height = saved + 'px';

      let dragging = false;
      let startY = 0;
      let startHeight = 0;
      let maxPx = 0;

      handle.addEventListener('pointerdown', (e) => {
        dragging = true;
        startY = e.clientY;
        startHeight = panel.getBoundingClientRect().height;
        maxPx = maxHeightFor(panel);
        try {
          handle.setPointerCapture(e.pointerId);
        } catch (error) {
          // Capture is an optimisation; the drag still tracks without it.
        }
        e.preventDefault();
      });

      handle.addEventListener('pointermove', (e) => {
        if (!dragging) return;
        // Dragging down grows a panel above the handle and shrinks one below.
        const delta = edge === 'below' ? startY - e.clientY : e.clientY - startY;
        const height = Math.min(maxPx, Math.max(minPx, startHeight + delta));
        panel.style.height = height + 'px';
      });

      const endDrag = (e) => {
        if (!dragging) return;
        dragging = false;
        localStorage.setItem(storageKey, Math.round(parseFloat(panel.style.height)));
        try {
          handle.releasePointerCapture(e.pointerId);
        } catch (error) {
          // Nothing captured; nothing to release.
        }
      };

      handle.addEventListener('pointerup', endDrag);
      handle.addEventListener('pointercancel', endDrag);
    }

    // Decode each frame off-screen and swap it in only once it is ready.
    // Assigning straight to the visible <img> blanks it while the browser
    // decodes, which reads as a blink on every frame.
    let screenshotSeq = 0;

    function updateScreenshot(screenshot) {
      if (!screenshot || !screenshotVisible) return;

      const seq = ++screenshotSeq;
      const loader = new Image();
      loader.onload = () => {
        // Drop frames that arrived out of order behind a newer one.
        if (seq !== screenshotSeq) return;
        const img = document.getElementById('screenshotImg');
        img.src = loader.src;
        if (img.style.display === 'none') {
          img.style.display = '';
          document.getElementById('screenshotEmpty').style.display = 'none';
        }
      };
      loader.src = screenshot;
    }

    function setScreenshotVisible(visible) {
      screenshotVisible = visible;
      setPanelVisible('screenshotPanel', 'screenshotResize', visible);
      setToggle('toggle-screenshot', visible);
    }

    function toggleScreenshot() {
      setScreenshotVisible(!screenshotVisible);
    }

    function setLaser(active) {
      if (active === laserActive) return;
      laserActive = active;
      setToggle('toggle-laser', laserActive);

      if (laserActive) {
        document.addEventListener('mousemove', handleLaserMove);
        document.addEventListener('touchmove', handleLaserMove);
      } else {
        document.removeEventListener('mousemove', handleLaserMove);
        document.removeEventListener('touchmove', handleLaserMove);
        socket.emit('laser-pointer', { code: sessionCode, token: clickerToken, x: 0, y: 0, active: false });
      }
    }

    function toggleLaser() {
      setLaser(!laserActive);
    }

    function handleLaserMove(e) {
      if (!laserActive) return;
      
      let x, y;
      if (e.type.startsWith('touch')) {
        const touch = e.touches[0];
        x = touch.clientX / window.innerWidth;
        y = touch.clientY / window.innerHeight;
      } else {
        x = e.clientX / window.innerWidth;
        y = e.clientY / window.innerHeight;
      }
      
      socket.emit('laser-pointer', { code: sessionCode, token: clickerToken, x, y, active: true });
    }

    function toggleVoice() {
      voiceActive = !voiceActive;
      setToggle('toggle-voice', voiceActive);

      if (voiceActive) {
        startVoiceRecognition();
      } else {
        stopVoiceRecognition();
      }
    }

    function startVoiceRecognition() {
      if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
        alert('Voice recognition not supported in this browser');
        voiceActive = false;
        setToggle('toggle-voice', false);
        return;
      }
      
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = false;
      recognition.lang = 'en-US';
      
      recognition.onresult = (event) => {
        const last = event.results.length - 1;
        const text = event.results[last][0].transcript.toLowerCase().trim();
        
        console.log('Voice recognized:', text);
        
        if (text.includes('next') && text.includes('slide')) {
          sendCommand('next');
        } else if (text.includes('last') && text.includes('slide') || text.includes('previous') && text.includes('slide')) {
          sendCommand('prev');
        }
      };
      
      recognition.onerror = (event) => {
        console.error('Voice recognition error:', event.error);
      };
      
      recognition.onend = () => {
        if (voiceActive) {
          recognition.start();
        }
      };
      
      recognition.start();
    }

    function stopVoiceRecognition() {
      if (recognition) {
        recognition.stop();
        recognition = null;
      }
    }

    function showMessage(message) {
      document.getElementById('messageText').textContent = message;
      document.getElementById('messageModal').classList.add('active');
    }

    function closeMessageModal() {
      document.getElementById('messageModal').classList.remove('active');
    }

    document.getElementById('displayNameInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        const code = document.getElementById('codeInput').value.trim().toUpperCase();
        if (code) {
          joinSession(code);
        }
      }
    });

    document.getElementById('codeInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        checkSessionAndJoin();
      }
    });

    document.getElementById('modalNameInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        submitNameFromModal();
      }
    });

    // The header grows downward as you drag; the notes panel grows upward.
    makeResizable('headerResize', 'headerSection', 'above', 'oc-header-height', 90);
    makeResizable('screenshotResize', 'screenshotPanel', 'above', 'oc-preview-height', 80);
    makeResizable('notesResize', 'notesSection', 'below', 'oc-notes-height', 44);

    setToggle('toggle-notes', showNotesPref);
    setToggle('toggle-wake', wakeLockPref);
    applyNotesFontSize();
    clampPanels();
    window.addEventListener('resize', clampPanels);
    window.addEventListener('orientationchange', clampPanels);

    // Auto-join if code is in URL
    const urlParams = new URLSearchParams(window.location.search);
    const urlCode = urlParams.get('code');
    if (urlCode) {
      document.getElementById('codeInput').value = urlCode.toUpperCase();
      checkSessionAndJoin();
    }
  </script>
</body>
</html>
