<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1a1a1a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Show Cue Display - Open Clicker</title>
  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    html {
      height: 100%;
      overflow: hidden;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a1a;
      color: white;
      height: 100%;
      overflow: hidden;
      touch-action: manipulation;
      position: fixed;
      width: 100%;
    }
    #join-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding: max(20px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
    }
    h1 {
      margin-bottom: 24px;
      font-size: clamp(24px, 6vw, 32px);
    }
    .join-form {
      background: #2a2a2a;
      padding: 24px;
      border-radius: 16px;
      width: 100%;
      max-width: 400px;
    }
    .info {
      background: #1a1a1a;
      padding: 16px;
      border-radius: 12px;
      margin-bottom: 16px;
      font-size: 13px;
      color: #999;
      line-height: 1.5;
    }
    .info strong {
      color: white;
    }
    input[type="text"] {
      width: 100%;
      padding: 16px;
      font-size: 20px;
      border: 2px solid #444;
      border-radius: 12px;
      background: #1a1a1a;
      color: white;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 16px;
    }
    input[type="text"]:focus {
      outline: none;
      border-color: #667eea;
    }
    .button {
      width: 100%;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 12px;
      padding: 16px;
      font-size: 18px;
      cursor: pointer;
      transition: all 0.2s;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      min-height: 48px;
    }
    .button:active {
      transform: scale(0.98);
    }
    .error {
      color: #dc3545;
      margin-top: 12px;
      text-align: center;
      font-size: 14px;
    }
    #cue-display {
      display: none;
      height: 100vh;
      height: 100dvh;
      flex-direction: column;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }
    .header {
      padding: 16px max(16px, env(safe-area-inset-left)) 16px max(16px, env(safe-area-inset-right));
      text-align: center;
      background: #2a2a2a;
      flex-shrink: 0;
    }
    .session-info {
      font-size: 12px;
      color: #999;
    }
    .session-code {
      font-size: clamp(20px, 5vw, 24px);
      font-weight: bold;
      color: #667eea;
      font-family: 'Courier New', monospace;
      margin: 6px 0;
    }
    .status {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      margin-top: 4px;
      background: #28a745;
    }
    .time-display {
      margin: 10px 0 6px;
    }
    .clock {
      font-size: clamp(20px, 5vw, 24px);
      font-weight: 600;
      font-family: 'Courier New', monospace;
      color: #999;
      margin-bottom: 4px;
    }
    .timer {
      font-size: clamp(32px, 8vw, 42px);
      font-weight: bold;
      font-family: 'Courier New', monospace;
      color: #667eea;
    }
    .timer.idle {
      font-size: clamp(18px, 4.5vw, 22px);
      color: #555;
    }
    .timer.warning { color: #ffc107; }
    .timer.danger { color: #dc3545; }
    .laser-pointer {
      position: fixed;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,0,0,1) 0%, rgba(255,0,0,0.8) 50%, rgba(255,0,0,0) 100%);
      pointer-events: none;
      z-index: 9999;
      display: none;
      box-shadow: 0 0 20px rgba(255,0,0,0.8);
    }
    .cue-indicators {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
      min-height: 0;
      overflow: hidden;
      background: #0a0a0a;
    }
    .cue-indicator {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a0a;
      border: 2px solid #1a1a1a;
      min-height: 120px;
      user-select: none;
      -webkit-user-select: none;
    }
    .led-triangle {
      position: relative;
      width: min(40vw, 280px);
      height: min(40vw, 280px);
    }
    .led-dot {
      position: absolute;
      width: min(4vw, 24px);
      height: min(4vw, 24px);
      border-radius: 50%;
      transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .cue-indicator.prev .led-dot {
      background: #330000;
      box-shadow: 0 0 3px rgba(139, 0, 0, 0.3);
    }
    .cue-indicator.prev.active .led-dot {
      background: #ff0000;
      box-shadow: 
        0 0 10px rgba(255, 0, 0, 0.8),
        0 0 20px rgba(255, 0, 0, 0.6),
        0 0 30px rgba(255, 0, 0, 0.4),
        inset 0 0 10px rgba(255, 100, 100, 0.8);
    }
    .cue-indicator.next .led-dot {
      background: #003300;
      box-shadow: 0 0 3px rgba(0, 100, 0, 0.3);
    }
    .cue-indicator.next.active .led-dot {
      background: #00ff00;
      box-shadow: 
        0 0 10px rgba(0, 255, 0, 0.8),
        0 0 20px rgba(0, 255, 0, 0.6),
        0 0 30px rgba(0, 255, 0, 0.4),
        inset 0 0 10px rgba(100, 255, 100, 0.8);
    }
    .notes {
      padding: 14px max(16px, env(safe-area-inset-left)) 14px max(16px, env(safe-area-inset-right));
      background: #2a2a2a;
      max-height: 160px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      border-top: 2px solid #1a1a1a;
      flex-shrink: 0;
    }
    .notes-title {
      font-size: 11px;
      color: #999;
      text-transform: uppercase;
      margin-bottom: 6px;
      font-weight: 600;
    }
    .notes-content {
      font-size: 14px;
      line-height: 1.5;
      color: #ccc;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .header-controls {
      margin-top: 12px;
      display: flex;
      gap: 20px;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
    }
    .toggle-control {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      cursor: pointer;
      user-select: none;
      color: #999;
    }
    .toggle-switch {
      position: relative;
      width: 40px;
      height: 22px;
      background: #444;
      border-radius: 11px;
      transition: background 0.3s;
    }
    .toggle-switch.active {
      background: #667eea;
    }
    .toggle-slider {
      position: absolute;
      top: 2px;
      left: 2px;
      width: 18px;
      height: 18px;
      background: white;
      border-radius: 50%;
      transition: transform 0.3s;
    }
    .toggle-switch.active .toggle-slider {
      transform: translateX(18px);
    }
    @media (max-width: 400px) {
      .join-form {
        padding: 20px;
      }
      .header {
        padding: 12px max(12px, env(safe-area-inset-left)) 12px max(12px, env(safe-area-inset-right));
      }
    }
  </style>
</head>
<body>
  <div id="join-screen">
    <h1>🖥️ Show Cue Display</h1>
    <div class="join-form">
      <div class="info">
        <strong>Visual cue display</strong> for presenters. Shows LED indicators when slides advance.
      </div>
      <input type="text" id="codeInput" placeholder="Session Code" autocomplete="off">
      <button class="button" onclick="joinSession()">Join Session</button>
      <div class="error" id="error"></div>
    </div>
  </div>

  <div id="cue-display">
    <div class="header">
      <div class="session-info">Session</div>
      <div class="session-code" id="sessionCode"></div>
      <div>
        <span class="status" id="status">● Active</span>
      </div>
      <div class="time-display">
        <div class="clock" id="clock">--:--:--</div>
        <div class="timer idle" id="timer">No timer set</div>
      </div>
      <div class="header-controls">
        <div class="toggle-control" onclick="toggleMute()">
          <div class="toggle-switch" id="muteToggle">
            <div class="toggle-slider"></div>
          </div>
          <span id="muteLabel">Beep ON</span>
        </div>
        <div class="toggle-control" onclick="toggleCueOnly()">
          <div class="toggle-switch" id="cueOnlyToggle">
            <div class="toggle-slider"></div>
          </div>
          <span id="cueOnlyLabel">Cue Only OFF</span>
        </div>
      </div>
    </div>
    
    <div class="laser-pointer" id="laserPointer"></div>
    
    <div class="cue-indicators">
      <div class="cue-indicator prev" id="prevIndicator">
        <div class="led-triangle" id="prevTriangle"></div>
      </div>
      <div class="cue-indicator next" id="nextIndicator">
        <div class="led-triangle" id="nextTriangle"></div>
      </div>
    </div>

    <div class="notes" id="notesSection" style="display: none;">
      <div class="notes-title">Speaker Notes</div>
      <div class="notes-content" id="notesContent"></div>
    </div>
  </div>

  <script src="/common.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let sessionCode = null;
    let showToken = null;
    let timerInterval = null;
    let timerEndTime = null;
    let clockInterval = null;
    let features = {};
    let audioContext = null;
    let audioUnlocked = false;
    
    // Load settings from localStorage
    let isMuted = localStorage.getItem('showMuted') === 'true';
    let isCueOnly = localStorage.getItem('showCueOnly') === 'true';

    // Initialize AudioContext (will be unlocked on first user gesture)
    function initAudioContext() {
      if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
      }
      return audioContext;
    }

    // Unlock audio on first user interaction
    function unlockAudio() {
      if (!audioUnlocked) {
        const ctx = initAudioContext();
        if (ctx.state === 'suspended') {
          ctx.resume();
        }
        const buffer = ctx.createBuffer(1, 1, 22050);
        const source = ctx.createBufferSource();
        source.buffer = buffer;
        source.connect(ctx.destination);
        source.start(0);
        audioUnlocked = true;
      }
    }

    // Play beep sound using Web Audio API
    function playBeep(frequency, duration) {
      if (isMuted || !audioUnlocked) return;
      
      const ctx = initAudioContext();
      const oscillator = ctx.createOscillator();
      const gainNode = ctx.createGain();
      
      oscillator.connect(gainNode);
      gainNode.connect(ctx.destination);
      
      oscillator.frequency.value = frequency;
      oscillator.type = 'sine';
      
      gainNode.gain.setValueAtTime(0.3, ctx.currentTime);
      gainNode.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + duration);
      
      oscillator.start(ctx.currentTime);
      oscillator.stop(ctx.currentTime + duration);
    }

    // Toggle mute
    function toggleMute() {
      isMuted = !isMuted;
      localStorage.setItem('showMuted', isMuted);
      updateMuteUI();
    }

    // Update mute UI
    function updateMuteUI() {
      const toggle = document.getElementById('muteToggle');
      const label = document.getElementById('muteLabel');
      if (isMuted) {
        toggle.classList.remove('active');
        label.textContent = 'Beep OFF';
      } else {
        toggle.classList.add('active');
        label.textContent = 'Beep ON';
      }
    }

    // Toggle cue-only mode
    function toggleCueOnly() {
      isCueOnly = !isCueOnly;
      localStorage.setItem('showCueOnly', isCueOnly);
      updateCueOnlyUI();
    }

    // Update cue-only UI
    function updateCueOnlyUI() {
      const toggle = document.getElementById('cueOnlyToggle');
      const label = document.getElementById('cueOnlyLabel');
      if (isCueOnly) {
        toggle.classList.add('active');
        label.textContent = 'Cue Only ON';
      } else {
        toggle.classList.remove('active');
        label.textContent = 'Cue Only OFF';
      }
    }

    function createLEDTriangle(container, direction) {
      const rows = direction === 'left' ? 7 : 7;
      const dots = [];
      
      for (let row = 0; row < rows; row++) {
        const dotsInRow = row + 1;
        for (let col = 0; col < dotsInRow; col++) {
          const dot = document.createElement('div');
          dot.className = 'led-dot';
          
          if (direction === 'left') {
            const rowOffset = (rows - row - 1) * 0.5;
            dot.style.left = `${row * 14}%`;
            dot.style.top = `${rowOffset * 14 + col * 14}%`;
          } else {
            const rowOffset = (rows - row - 1) * 0.5;
            dot.style.right = `${row * 14}%`;
            dot.style.top = `${rowOffset * 14 + col * 14}%`;
          }
          
          container.appendChild(dot);
          dots.push(dot);
        }
      }
      
      return dots;
    }

    createLEDTriangle(document.getElementById('prevTriangle'), 'left');
    createLEDTriangle(document.getElementById('nextTriangle'), 'right');

    socket.on('session-joined', (data) => {
      sessionCode = data.code;
      showToken = data.token;
      features = data.features || {};
      
      document.getElementById('sessionCode').textContent = data.code;
      document.getElementById('join-screen').style.display = 'none';
      document.getElementById('cue-display').style.display = 'flex';
      
      // Initialize UI states
      updateMuteUI();
      updateCueOnlyUI();
      
      if (data.notes) {
        updateNotes(data.notes);
      }

      if (data.timer && data.timerStartedAt) {
        timerEndTime = data.timerStartedAt + (data.timer * 1000);
        updateTimerDisplay();
        timerInterval = setInterval(updateTimerDisplay, 100);
      } else {
        updateTimerDisplay();
      }
      
      updateClock();
      clockInterval = setInterval(updateClock, 1000);
      
    });

    socket.on('advance', ({ direction }) => {
      const indicator = direction === 'next' ? 
        document.getElementById('nextIndicator') : 
        document.getElementById('prevIndicator');
      
      // Always light the LED indicator
      indicator.classList.add('active');
      
      // Play beep if not muted
      if (direction === 'next') {
        playBeep(800, 0.1); // Higher pitch for next
      } else {
        playBeep(400, 0.12); // Lower pitch for prev
      }
      
      // Only dispatch keyboard event if NOT in cue-only mode
      if (!isCueOnly) {
        const event = new KeyboardEvent('keydown', {
          key: direction === 'next' ? 'ArrowRight' : 'ArrowLeft',
          code: direction === 'next' ? 'ArrowRight' : 'ArrowLeft',
          bubbles: true
        });
        document.dispatchEvent(event);
      }
      
      setTimeout(() => {
        indicator.classList.remove('active');
      }, 800);
    });

    socket.on('notes-changed', ({ notes }) => {
      updateNotes(notes);
    });

    socket.on('timer-changed', ({ timer, timerStartedAt }) => {
      timerEndTime = timerStartedAt + (timer * 1000);
      updateTimerDisplay();
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(updateTimerDisplay, 100);
    });

    socket.on('features-changed', ({ features: newFeatures }) => {
      features = { ...features, ...newFeatures };
    });

    socket.on('laser-pointer', ({ x, y, active }) => {
      const laser = document.getElementById('laserPointer');
      if (active && features.laserPointerEnabled) {
        laser.style.display = 'block';
        laser.style.left = (x * window.innerWidth - 12) + 'px';
        laser.style.top = (y * window.innerHeight - 12) + 'px';
      } else {
        laser.style.display = 'none';
      }
    });

    socket.on('error', ({ message }) => {
      document.getElementById('error').textContent = message;
    });

    socket.on('session-ended', () => {
      alert('Session ended by producer');
      location.reload();
    });

    function joinSession() {
      const code = document.getElementById('codeInput').value.trim().toUpperCase();
      
      if (!code) {
        document.getElementById('error').textContent = 'Please enter session code';
        return;
      }
      
      // Unlock audio on join button click
      unlockAudio();
      
      document.getElementById('error').textContent = '';
      socket.emit('join-session', { code, role: 'show-client' });
    }

    function updateNotes(notes) {
      const notesSection = document.getElementById('notesSection');
      const notesContent = document.getElementById('notesContent');
      
      if (notes && notes.trim()) {
        notesContent.textContent = notes;
        notesSection.style.display = 'block';
      } else {
        notesSection.style.display = 'none';
      }
    }

    function updateClock() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      document.getElementById('clock').textContent = `${hours}:${minutes}:${seconds}`;
    }

    function updateTimerDisplay() {
      const display = document.getElementById('timer');
      
      if (!timerEndTime) {
        display.textContent = 'No timer set';
        display.className = 'timer idle';
        return;
      }
      
      const remaining = Math.max(0, timerEndTime - Date.now());
      const totalSeconds = Math.floor(remaining / 1000);
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = totalSeconds % 60;
      
      display.textContent = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
      
      display.className = 'timer';
      if (remaining === 0) {
        display.className = 'timer danger';
        if (timerInterval) {
          clearInterval(timerInterval);
          timerInterval = null;
        }
      } else if (remaining < 60000) {
        display.className = 'timer danger';
      } else if (remaining < 300000) {
        display.className = 'timer warning';
      }
    }

    document.getElementById('codeInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        joinSession();
      }
    });

    // Unlock audio on any user interaction
    document.addEventListener('click', unlockAudio, { once: true });
    document.addEventListener('touchstart', unlockAudio, { once: true });

    // Auto-join if code is in URL
    const urlParams = new URLSearchParams(window.location.search);
    const urlCode = urlParams.get('code');
    if (urlCode) {
      document.getElementById('codeInput').value = urlCode.toUpperCase();
      joinSession();
    }

    mountVersionStamp('dark');
  </script>
</body>
</html>
