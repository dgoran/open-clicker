<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f5">
  <title>Producer - Open Clicker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f5;
      padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
      min-height: 100vh;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
    }
    header {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    h1 {
      color: #333;
      margin-bottom: 8px;
      font-size: clamp(20px, 5vw, 24px);
    }
    .session-code {
      font-size: clamp(24px, 6vw, 32px);
      font-weight: bold;
      color: #667eea;
      margin: 12px 0;
      font-family: 'Courier New', monospace;
      word-break: break-all;
    }
    .card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .card h2 {
      color: #333;
      margin-bottom: 14px;
      font-size: clamp(16px, 4vw, 18px);
    }
    .button {
      background: #667eea;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 12px 20px;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.2s;
      font-weight: 500;
      min-height: 44px;
      touch-action: manipulation;
    }
    .button:hover {
      background: #5568d3;
    }
    .button:active {
      transform: scale(0.98);
    }
    .button:disabled {
      background: #ccc;
      cursor: not-allowed;
      transform: none;
    }
    .button.danger {
      background: #dc3545;
    }
    .button.danger:hover {
      background: #c82333;
    }
    .button.success {
      background: #28a745;
    }
    .button.success:hover {
      background: #218838;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 16px;
    }
    .controls .button {
      flex: 1;
      min-width: 140px;
    }
    textarea {
      width: 100%;
      min-height: 100px;
      padding: 12px;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
      font-family: inherit;
      resize: vertical;
    }
    textarea:focus {
      outline: none;
      border-color: #667eea;
    }
    .timer-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 16px;
      align-items: center;
    }
    .timer-controls .button {
      flex: 1;
      min-width: 100px;
    }
    .timer-display {
      font-size: clamp(36px, 10vw, 48px);
      font-weight: bold;
      color: #333;
      text-align: center;
      margin: 12px 0;
      font-family: 'Courier New', monospace;
    }
    .timer-display.warning {
      color: #ffc107;
    }
    .timer-display.danger {
      color: #dc3545;
    }
    input[type="number"] {
      padding: 10px 12px;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
      width: 80px;
      min-width: 70px;
    }
    input[type="number"]:focus {
      outline: none;
      border-color: #667eea;
    }
    .status {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 500;
    }
    .status.locked {
      background: #dc3545;
      color: white;
    }
    .status.unlocked {
      background: #28a745;
      color: white;
    }
    #setup {
      text-align: center;
      padding: 40px 20px;
      min-height: 60vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    #setup h1 {
      font-size: clamp(22px, 6vw, 28px);
      margin-bottom: 12px;
    }
    #setup p {
      font-size: 15px;
    }
    #setup .button {
      font-size: 17px;
      padding: 14px 28px;
      margin-top: 8px;
    }
    #producer {
      display: none;
    }
    .presenter-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px;
      background: #f8f9fa;
      border-radius: 8px;
      margin-bottom: 8px;
      flex-wrap: wrap;
      gap: 8px;
    }
    .presenter-info {
      flex: 1;
      min-width: 120px;
    }
    .presenter-name {
      font-weight: 600;
      color: #333;
      font-size: 15px;
    }
    .presenter-status {
      font-size: 13px;
      color: #666;
      margin-top: 4px;
    }
    .presenter-controls {
      display: flex;
      gap: 8px;
    }
    .presenter-controls .button {
      padding: 8px 16px;
      font-size: 14px;
      min-height: 36px;
    }
    @media (max-width: 480px) {
      body {
        padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
      }
      header, .card {
        padding: 16px;
        margin-bottom: 12px;
      }
      .controls {
        flex-direction: column;
      }
      .controls .button {
        width: 100%;
        min-width: auto;
      }
      .timer-controls {
        flex-direction: column;
        align-items: stretch;
      }
      .timer-controls .button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div id="setup">
      <h1>Producer Control</h1>
      <p style="color: #666; margin: 16px 0 32px;">Create a new presentation session</p>
      <button class="button" onclick="createSession()">Create Session</button>
    </div>

    <div id="producer">
      <header>
        <h1>Producer Control</h1>
        <div class="session-code" id="sessionCode"></div>
        <p style="color: #666;">Share this code with clickers and the show client</p>
      </header>

      <div class="card">
        <h2>Presenters</h2>
        <p style="color: #666; margin-bottom: 16px;">Connected presenters and their click access status</p>
        <div id="presentersList">
          <p style="color: #999; font-style: italic;">No presenters connected yet</p>
        </div>
      </div>

      <div class="card">
        <h2>Global Clicker Lock</h2>
        <p style="color: #666; margin-bottom: 16px;">
          Status: <span class="status unlocked" id="lockStatus">Unlocked</span>
        </p>
        <div class="controls">
          <button class="button danger" id="lockBtn" onclick="setLock(true)">Lock All Clickers</button>
          <button class="button success" id="unlockBtn" onclick="setLock(false)">Unlock All Clickers</button>
        </div>
      </div>

      <div class="card">
        <h2>Countdown Timer</h2>
        <div class="timer-display" id="timerDisplay">--:--</div>
        <div class="timer-controls">
          <input type="number" id="timerMinutes" min="1" max="999" value="30" placeholder="Minutes">
          <button class="button" onclick="startTimer()">Start Timer</button>
          <button class="button" onclick="resetTimer()">Reset</button>
        </div>
      </div>

      <div class="card">
        <h2>Speaker Notes</h2>
        <textarea id="notes" placeholder="Enter speaker notes here..."></textarea>
        <div style="margin-top: 12px;">
          <button class="button" onclick="saveNotes()">Save Notes</button>
        </div>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let sessionCode = null;
    let producerToken = null;
    let timerInterval = null;
    let timerEndTime = null;

    socket.on('session-created', ({ code, token }) => {
      sessionCode = code;
      producerToken = token;
      document.getElementById('sessionCode').textContent = code;
      document.getElementById('setup').style.display = 'none';
      document.getElementById('producer').style.display = 'block';
    });

    socket.on('lock-changed', ({ locked }) => {
      updateLockStatus(locked);
    });

    socket.on('presenters-updated', ({ presenters }) => {
      updatePresentersList(presenters);
    });

    function createSession() {
      socket.emit('create-session');
    }

    function setLock(locked) {
      socket.emit('set-lock', { code: sessionCode, token: producerToken, locked });
      updateLockStatus(locked);
    }

    function updateLockStatus(locked) {
      const status = document.getElementById('lockStatus');
      const lockBtn = document.getElementById('lockBtn');
      const unlockBtn = document.getElementById('unlockBtn');
      
      if (locked) {
        status.textContent = 'Locked';
        status.className = 'status locked';
        lockBtn.disabled = true;
        unlockBtn.disabled = false;
      } else {
        status.textContent = 'Unlocked';
        status.className = 'status unlocked';
        lockBtn.disabled = false;
        unlockBtn.disabled = true;
      }
    }

    function startTimer() {
      const minutes = parseInt(document.getElementById('timerMinutes').value);
      if (minutes > 0) {
        socket.emit('set-timer', { code: sessionCode, token: producerToken, minutes });
        timerEndTime = Date.now() + (minutes * 60 * 1000);
        updateTimerDisplay();
        if (timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(updateTimerDisplay, 100);
      }
    }

    function resetTimer() {
      socket.emit('reset-timer', { code: sessionCode, token: producerToken });
      const minutes = parseInt(document.getElementById('timerMinutes').value);
      timerEndTime = Date.now() + (minutes * 60 * 1000);
      updateTimerDisplay();
    }

    function updateTimerDisplay() {
      if (!timerEndTime) return;
      
      const remaining = Math.max(0, timerEndTime - Date.now());
      const totalSeconds = Math.floor(remaining / 1000);
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = totalSeconds % 60;
      
      const display = document.getElementById('timerDisplay');
      display.textContent = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
      
      display.className = 'timer-display';
      if (remaining === 0) {
        display.className = 'timer-display danger';
        if (timerInterval) {
          clearInterval(timerInterval);
          timerInterval = null;
        }
      } else if (remaining < 60000) {
        display.className = 'timer-display danger';
      } else if (remaining < 300000) {
        display.className = 'timer-display warning';
      }
    }

    function saveNotes() {
      const notes = document.getElementById('notes').value;
      socket.emit('set-notes', { code: sessionCode, token: producerToken, notes });
    }

    document.getElementById('notes').addEventListener('input', () => {
      saveNotes();
    });

    socket.on('timer-changed', ({ timer, timerStartedAt }) => {
      timerEndTime = timerStartedAt + (timer * 1000);
      updateTimerDisplay();
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(updateTimerDisplay, 100);
    });

    function updatePresentersList(presenters) {
      const container = document.getElementById('presentersList');
      
      if (!presenters || presenters.length === 0) {
        container.innerHTML = '<p style="color: #999; font-style: italic;">No presenters connected yet</p>';
        return;
      }
      
      container.innerHTML = presenters.map(presenter => `
        <div class="presenter-item">
          <div class="presenter-info">
            <div class="presenter-name">${escapeHtml(presenter.displayName)}</div>
            <div class="presenter-status" style="color: ${presenter.clickAccessEnabled ? '#28a745' : '#dc3545'}">
              ${presenter.clickAccessEnabled ? 'Click Access: Enabled' : 'Click Access: Suspended'}
            </div>
          </div>
          <div class="presenter-controls">
            ${presenter.clickAccessEnabled ? 
              `<button class="button danger" onclick="togglePresenterAccess('${presenter.id}', false)">Suspend</button>` :
              `<button class="button success" onclick="togglePresenterAccess('${presenter.id}', true)">Enable</button>`
            }
          </div>
        </div>
      `).join('');
    }

    function togglePresenterAccess(presenterId, enabled) {
      socket.emit('toggle-presenter-access', {
        code: sessionCode,
        token: producerToken,
        presenterId,
        enabled
      });
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
  </script>
</body>
</html>
