services:
  - type: web
    name: open-clicker
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: SUPERADMIN_USER
        value: admin
      - key: SUPERADMIN_PASSWORD
        sync: false
    disk:
      name: open-clicker-data
      mountPath: /data
      sizeGB: 1
